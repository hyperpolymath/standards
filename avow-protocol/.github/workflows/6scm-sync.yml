name: 6SCM Mirror Check

on:
  push:
    paths:
      - '.machine_readable/**'
  pull_request:
    paths:
      - '.machine_readable/**'

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - name: Check 6scm mirrors
        run: bash scripts/check-6scm.sh
