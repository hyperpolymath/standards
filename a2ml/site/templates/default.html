<!DOCTYPE html>
<!--
  SPDX-License-Identifier: MPL-2.0
  a2ml.net site template (ddraig-ssg) — WCAG 2.2 AAA-capable, SEO-max.
  Variables: title, brand, description, date, canonical, toc, content
  (content substituted last). JSON-LD below is static (not templated) to
  avoid HTML-entity escaping corrupting embedded JSON.
-->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{title}}</title>
  <meta name="description" content="{{description}}">
  <meta name="color-scheme" content="light dark">
  <link rel="canonical" href="{{canonical}}">

  <!-- Open Graph / Twitter -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="{{brand}}">
  <meta property="og:title" content="{{title}}">
  <meta property="og:description" content="{{description}}">
  <meta property="og:url" content="{{canonical}}">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="{{title}}">
  <meta name="twitter:description" content="{{description}}">

  <!-- Discovery -->
  <link rel="alternate" type="application/atom+xml" title="A2ML updates" href="/feed.xml">
  <link rel="sitemap" type="application/xml" href="/sitemap.xml">
  <link rel="stylesheet" href="/assets/style.css">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">

  <!-- Structured data (schema.org) -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "SoftwareSourceCode",
    "name": "A2ML",
    "alternateName": "Attested Markup Language",
    "description": "A lightweight, Djot-like markup that compiles into a typed, attested core with progressive strictness (lax, checked, attested).",
    "url": "https://a2ml.net/",
    "codeRepository": "https://github.com/hyperpolymath/a2ml-ecosystem",
    "license": ["https://www.mozilla.org/MPL/2.0/", "https://creativecommons.org/licenses/by-sa/4.0/"],
    "programmingLanguage": "A2ML",
    "author": {
      "@type": "Person",
      "name": "Jonathan D.A. Jewell"
    }
  }
  </script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="site-header">
    <nav class="container nav" aria-label="Primary">
      <a class="brand" href="/">{{brand}}</a>
      <ul class="nav-links">
        <li><a href="/">Home</a></li>
        <li><a href="/spec.html">Spec</a></li>
        <li><a href="/start.html">Get started</a></li>
        <li><a href="/downloads.html">Downloads</a></li>
        <li><a href="/roadmap.html">Roadmap</a></li>
      </ul>
    </nav>
  </header>
  <main id="main" class="container" tabindex="-1">
    <article class="prose">
      {{content}}
    </article>
  </main>
  <footer class="site-footer">
    <div class="container">
      <p class="muted">Share:
        <a href="https://twitter.com/intent/tweet?text={{title}}&url={{canonical}}">X / Twitter</a> &middot;
        <a href="https://www.linkedin.com/sharing/share-offsite/?url={{canonical}}">LinkedIn</a> &middot;
        <a href="https://reddit.com/submit?url={{canonical}}&title={{title}}">Reddit</a> &middot;
        <a href="https://news.ycombinator.com/submitlink?u={{canonical}}&t={{title}}">Hacker News</a> &middot;
        <a href="/feed.xml">RSS/Atom feed</a>
      </p>
      <p class="muted">&#169; Jonathan D.A. Jewell &middot; Code <a href="https://www.mozilla.org/MPL/2.0/">MPL-2.0</a>, docs <a href="https://creativecommons.org/licenses/by-sa/4.0/">CC-BY-SA-4.0</a> &middot; <a href="/.well-known/security.txt">security.txt</a> &middot; <a href="https://github.com/hyperpolymath/a2ml-ecosystem">GitHub</a> &middot; <time>{{date}}</time></p>
    </div>
  </footer>
</body>
</html>
