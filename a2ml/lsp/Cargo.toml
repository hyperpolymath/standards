# SPDX-License-Identifier: PMPL-1.0-or-later
#
# A2ML Language Server — LSP server for A2ML (Attested Markup Language).
# Provides diagnostics, completions, and hover for .a2ml files.

[package]
name = "a2ml-lsp"
version = "0.1.0"
edition = "2021"
authors = ["Jonathan D.A. Jewell <j.d.a.jewell@open.ac.uk>"]
license = "PMPL-1.0-or-later"
description = "Language Server Protocol implementation for A2ML"
repository = "https://github.com/hyperpolymath/standards"
homepage = "https://github.com/hyperpolymath/standards/tree/main/a2ml/lsp"
readme = "README.adoc"
keywords = ["a2ml", "lsp", "language-server"]
categories = ["development-tools", "text-editors"]

[[bin]]
name = "a2ml-lsp"
path = "src/main.rs"

[dependencies]
tower-lsp = "0.20"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
dashmap = "6"
ropey = "1"
