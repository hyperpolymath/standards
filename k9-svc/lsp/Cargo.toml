# SPDX-License-Identifier: MPL-2.0
#
# Cargo.toml — K9 Language Server Protocol (LSP) server
#
# Provides diagnostics (linting), completions, and hover documentation
# for .k9 and .k9.ncl files (K9 Self-Validating Components).

[package]
name = "k9-lsp"
version = "0.1.0"
edition = "2021"
authors = ["Jonathan D.A. Jewell <j.d.a.jewell@open.ac.uk>"]
license = "AGPL-3.0-or-later"
description = "Language Server Protocol server for K9 Self-Validating Components"
repository = "https://github.com/hyperpolymath/standards"
homepage = "https://github.com/hyperpolymath/standards/tree/main/k9-svc/lsp"
readme = "README.adoc"
keywords = ["k9", "lsp", "nickel", "svc", "language-server"]
categories = ["development-tools", "text-editors"]

[dependencies]
tower-lsp = "0.20"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"

[[bin]]
name = "k9-lsp"
path = "src/main.rs"
