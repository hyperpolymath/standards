# SPDX-License-Identifier: MPL-2.0
name: Hypatia Security Scan

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  scan:
    uses: ../../../.github/workflows/hypatia-scan-reusable.yml
    secrets: inherit
