# SPDX-License-Identifier: MPL-2.0
#
# Gitleaks configuration — THE estate baseline.
#
# This file is the single shared allowlist for the whole estate. It is staged
# into a consumer repository's workspace root as `.gitleaks-estate.toml` by
# `.github/workflows/secret-scanner-reusable.yml`, so a repo can write:
#
#     [extend]
#     path = ".gitleaks-estate.toml"
#     [allowlist]
#     paths = [ ... entries true for THIS repo only ... ]
#
# and inherit everything here without copying it. See
# docs/GITLEAKS-ESTATE-BASELINE.adoc.
#
# ONLY UNIVERSAL ENTRIES BELONG HERE. An entry added to this file blinds every
# repository in the estate. If a suppression is only correct for one repo, it
# belongs in that repo's own `.gitleaks.toml`, beside the code it describes.
#
# THIS FILE IS LIVE PRODUCTION CONFIG, AND FOR MOST CONSUMERS IT IS UNPINNED.
# The reusable stages this baseline by TWO paths. A consumer that HAS its own
# `.gitleaks.toml` receives the copy fetched at `${{ job.workflow_sha }}` —
# pinned to whichever reusable SHA that consumer pins. A consumer with NO
# `.gitleaks.toml`, which is the large majority, is served by an earlier and
# ungated step that fetches from this repository's DEFAULT BRANCH. For those
# repositories an edit here takes effect on their very next run, with no pin
# standing between them and it.
#
# Two things follow. Edit this file as you would edit something already in
# production — a broadened pattern blinds 400+ repositories the same day. And
# a deliberate change arrives UNEVENLY: instantly for no-config consumers, and
# only at pin-bump speed for the rest. Stage behaviour changes accordingly.
#
# WHY THIS FILE EXISTS
# --------------------
# Until #500 the estate's gitleaks step carried `continue-on-error: true`, so
# the primary secret scanner could not fail a PR. #500 made it gate for real
# (`gitleaks detect --exit-code 1` against a checksum-verified binary). The
# first honest run then surfaced 15 findings in this repo — every one a false
# positive: module integrity hashes, package UUIDs, a public GPG fingerprint,
# a Haskell type *name*, and synthetic `.example` fixtures.
#
# That is very likely the trap the `continue-on-error` was papering over: turn
# the gate on with no allowlist, get a wall of red that is entirely noise,
# someone reverts, and the estate is back to a scanner that cannot fail. This
# config is therefore the *unblocker* for re-pinning callers onto the real
# gate across the estate.
#
# DESIGN RULE — KEEP THIS WHEN EDITING
# ------------------------------------
# Allowlist by PATTERN CLASS, anchored to the WHOLE value. Never allowlist a
# path wholesale because "that file is fine", and never disable a rule.
#
# Every `regexes` entry below is anchored `^...$` on purpose. An unanchored
# entry is a substring match, which silently blinds the scanner: a pattern
# like `(?i)test|example` would allowlist the real AWS key
# `wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY` purely because "EXAMPLE" appears
# inside it. That was caught by canary-testing an earlier draft of this file —
# if you add a pattern here, plant a realistic secret and confirm it is still
# detected before you commit.
#
# `paths` entries are limited to formats that cannot legitimately hold a live
# credential (lockfile integrity hashes, dependency UUIDs). If you want to
# allowlist any other path wholesale, that is a signal the secret should be
# removed from the tree instead.

[extend]
useDefault = true

[allowlist]
description = "Estate baseline: dependency metadata, anchored placeholder shapes, published test vectors"

# HOW THE `regexes` SECTION BELOW ACTUALLY BEHAVES — MEASURED. READ BEFORE EDITING.
#
# An earlier revision of this comment claimed that gitleaks matches these
# allowlist regexes against a finding's MATCH rather than its SECRET, and
# concluded that an anchored `^value$` entry is silently INERT for
# `generic-api-key`. THAT CLAIM IS FALSE, and every entry below depends on it
# being false — none of them sets `regexTarget`, and all eight are anchored on
# the value. Re-measured 2026-09-04 on the CI-pinned gitleaks 8.18.4, with the
# config and the JSON report both kept OUTSIDE the scanned tree:
#
#   fixture   Key : Ed25519_Private_Key;
#   MATCH   = `Key : Ed25519_Private_Key;`      SECRET = `Ed25519_Private_Key`
#
#     allowlist entry under test          findings   (control, no entry = 1)
#     ^SECRET$, regexTarget unset             0       SUPPRESSED
#     ^SECRET$, regexTarget = "secret"        0       SUPPRESSED
#     ^SECRET$, regexTarget = "match"         1       not suppressed
#     ^MATCH$,  regexTarget = "match"         0       SUPPRESSED
#
# `regexTarget` DEFAULTS TO THE SECRET. An anchored value regex is the normal,
# working way to exempt a `generic-api-key` false positive and needs no
# `regexTarget` at all. Field evidence agrees: one anchored value regex took
# metadatastician/cerro-torre from 19 findings to 12.
#
# ANCHOR ON THE SECRET AS THE TOOL EXTRACTS IT, NOT ON THE STRING YOU SEE. A
# specific rule outranks `generic-api-key` and may extract a NARROWER secret
# than the quoted value. Measured on the same fixture: `tok = "AKIA…EXAMPLE..."`
# is reported by `aws-access-token` with the trailing `...` NOT part of the
# secret, so the placeholder regex below — which requires it — does not fire;
# `sk_test_…` is reported by `stripe-access-token`, not by the `_test_` rule.
# Read the finding's `Secret` field (`--report-format json`) and anchor on
# that. Guessing from the source line is how a correct-looking entry misses.
#
# WHY THE FALSE CLAIM WAS BELIEVABLE — THE INSTRUMENT TRAP. If the gitleaks
# config or the JSON report lives INSIDE `--source`, gitleaks scans them too;
# their own credential-shaped content trips `generic-api-key`, the count never
# reaches zero, and a WORKING allowlist entry reads as inert. That is the most
# likely way the original measurement went wrong — it is easy to hit, silent,
# and it produces exactly the observation the old comment recorded. Reproduce
# correctly with `scripts/verify-regextarget-claim.sh`, which aborts unless the
# control shows exactly one finding.
#
# CONSEQUENCE FOR EDITORS — PREFER A VALUE ENTRY OVER A PATH ENTRY. A `regexes`
# entry suppresses exactly one string, so a credential planted in the same file
# is STILL caught. A `paths` entry blinds the whole file to everything. Reach
# for a path entry only where the value's SHAPE genuinely is a credential's —
# 64 lowercase hex, say, which is byte-for-byte a hex-encoded Ed25519 private
# key, so exempting the class would blind every such key in the tree. (Scoping
# a regex to a path — `[[allowlists]]` with `condition = "AND"` — would answer
# that case, but is SILENTLY IGNORED at 8.18.4; it arrives at 8.19+.)
#
# The character classes below are deliberately narrow, and that is not an
# oversight to be widened. `[A-Za-z]*` has no `_`, so the CamelCase crypto-type
# entry does NOT match Ada snake_case names such as `Ed25519_Private_Key`;
# those belong in the owning repository's own `.gitleaks.toml`, beside the code.

paths = [
  # This file, at its canonical path and under the name it is staged as in a
  # consumer workspace. While it lived at a repo root as `.gitleaks.toml`
  # gitleaks excluded it automatically as its own config; at any other path it
  # is an ordinary file, and its documented placeholder shapes trip
  # generic-api-key. Measured by scanning before and after the move.
  '''(^|/)\.gitleaks-estate\.toml$''',
  '''(^|/)config/gitleaks/estate-baseline\.toml$''',
  # The estate baseline ITSELF, staged into the workspace root by
  # secret-scanner-reusable.yml so that a repo-local `.gitleaks.toml` can
  # `[extend] path = ".gitleaks-estate.toml"` and inherit everything here.
  #
  # Without this entry the file detonates on itself: its anchored example
  # regexes (RFC 8032 vectors, masked-token shapes) are credential-SHAPED by
  # construction, so `generic-api-key` fires on the config and EVERY repo using
  # it goes red. Measured, not theoretical — same failure class as the
  # self-detonating template block that tripped the mint e2e guard.
  '''(^|/)\.gitleaks-estate\.toml$''',

  # Vendored package-manager bundles. Yarn's "zero-install" workflow commits a
  # published, checksum-pinned release binary; the high-entropy runs inside it
  # are minified third-party code, not estate source, and cannot be edited
  # meaningfully. Same category as a lockfile.
  '''(^|/)\.yarn/releases/''',
  # Lockfiles: the "secrets" are SHA-256 *integrity hashes* of public registry
  # modules. A lockfile has no legitimate reason to contain a credential.
  '''(^|/)deno\.lock$''',
  '''(^|/)package-lock\.json$''',
  '''(^|/)yarn\.lock$''',
  '''(^|/)Cargo\.lock$''',
  # Julia project manifests: entries are public package UUIDs from the General
  # registry, which trip the generic-api-key entropy heuristic.
  '''(^|/)Project\.toml$''',
  '''(^|/)Manifest\.toml$''',
]

regexes = [
  # --- documented placeholder shapes (all anchored to the whole value) ------

  # Ellipsis-terminated illustrative values: `abc123def456...` (carrying an
  # explicit "// Would be real token" comment), `1234567890_abc123...` inside a
  # fenced ASCII mockup of terminal output. A real credential is never elided.
  '''^[A-Za-z0-9_\-]{4,}\.\.\.$''',

  # Repeated-character masks: a provider prefix followed by a long run of a
  # single filler character (the GitLab, GitHub and OpenAI token prefixes are
  # all commonly masked this way in docs). A real credential never repeats one
  # character 8+ times.
  #
  # Deliberately described rather than shown: writing the masked token out
  # literally here makes THIS file trip the estate's Hypatia secret detector
  # ("Secret found: GitLab PAT"), which is how that was found. Do not add
  # literal example tokens to this file, even inside comments.
  '''^[A-Za-z0-9_\-]*?(x{8,}|X{8,}|y{8,}|z{8,}|0{12,}|\*{6,})[A-Za-z0-9_\-]*$''',

  # Monotonic hex walks used as filler: `0123456789abcdef` repeated,
  # `ABCDEF0123456789ABCDEF0123456789`, `0a1b2c3d4e5f6a7b…` (ascending nibble
  # pairs). These are keyboard-walk fillers, never generated key material.
  '''^(?i:0123456789abcdef|abcdef0123456789|0a1b2c3d4e5f6a7b8c9d0e1f2a3b4c5d6e7f8a9b0c1d2e3f4a5b6c7d8e9f0a1|deadbeef|cafebabe)+$''',

  # Snake-case self-labelled fixtures, e.g. `sg_test_api_key_abc123`. Anchored
  # and shape-constrained: an all-lowercase snake_case string with an explicit
  # test/demo marker as a bounded segment. Real API keys carry mixed case,
  # digits and symbols and will not match this.
  '''^[a-z]{2,6}_(test|demo|fake|sample|example|dummy|placeholder)_[a-z0-9_]{2,40}$''',

  # --- published test vectors ----------------------------------------------
  # RFC 8032 §7.1 TEST 1 Ed25519 seed and the public key it derives. These
  # exact values are printed in the RFC; checking that one yields the other is
  # the entire point of the interoperability test.
  '''^9d61b19deffd5a60ba844af492ec2cc44449c5697b326919703bac031cae7f60$''',
  '''^d75a980182b10ab7d54bfed3c964073a0ee172f3daa62325af021a68f707511a$''',

  # --- public-by-definition / non-secret identifiers ------------------------
  # OpenPGP 40-hex fingerprints. A fingerprint *identifies* a key; it is
  # published deliberately (SECURITY.md, audit records, keyservers) and
  # discloses nothing. Secret key *material* is PEM-armoured and is caught by
  # the dedicated private-key rules, which are NOT allowlisted here.
  '''^[A-F0-9]{40}$''',

  # Cryptographic *type names* appearing in source/design docs, e.g. the
  # Haskell declaration `data Ed25519KeyPair = Ed25519KeyPair`. A bare
  # CamelCase identifier with no digits or separators is a type, not a key.
  '''^(Ed25519|X25519|Curve25519|RSA|ECDSA|EdDSA|Secp256k1)[A-Za-z]*$''',
]
