# SPDX-License-Identifier: CC-BY-SA-4.0
# Illustrative only: this is not a live estate inventory or authorization.
# See MULTI-REPOSITORY-SCOPE-STANDARD.adoc.

schema = "hyperpolymath.repo-scope.v1"
status = "example"

[task]
id = "REPLACE-WITH-TASK-ID"
purpose = "REPLACE-WITH-A-SPECIFIC-OUTCOME"
action = "read-and-report" # read-and-report | propose | write
requested_by = "REPLACE-WITH-HUMAN-AUTHORITY"
approval = "not-granted" # not-granted | granted

# Each estate points to a maintained membership source. Do not treat this
# example, a search result, or an estate board as complete without verification.
[[estates]]
name = "hyperpolymath"
source = "REPLACE-WITH-AUTHORITATIVE-MEMBERSHIP-SOURCE"
source_revision = "REPLACE-WITH-COMMIT-OR-CENSUS-ID"
observed_at = "REPLACE-WITH-UTC-TIMESTAMP"
include = ["github.com/hyperpolymath/REPOSITORY"]
exclude = []

[[estates]]
name = "metadatastician"
source = "REPLACE-WITH-AUTHORITATIVE-MEMBERSHIP-SOURCE"
source_revision = "REPLACE-WITH-COMMIT-OR-CENSUS-ID"
observed_at = "REPLACE-WITH-UTC-TIMESTAMP"
include = ["github.com/metadatastician/REPOSITORY"]
exclude = []

# Use canonical host/owner/repository identities. Resolve selectors from BOTH
# declarations before writing, then place the exact union in resolved_scope.
[resolved_scope]
# This exact list, not the include rule alone, is the write boundary.
targets = ["github.com/OWNER/REPOSITORY"]
excluded = ["github.com/OWNER/ARCHIVED-OR-OUT-OF-SCOPE"]
unknown = []

[execution]
dry_run_required = true
batch_size = 1
allow_repository_settings_changes = false
allow_secrets_or_permissions_changes = false

[reporting]
per_repository_result_required = true
report_skipped_targets = true
report_uncertainty = true
