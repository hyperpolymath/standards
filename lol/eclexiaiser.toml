# eclexiaiser manifest — energy/carbon resource budgets
# SPDX-License-Identifier: PMPL-1.0-or-later

[project]
name = "lol"

[[functions]]
name = "analyzeFull"
source = "src/verisimdb/CorpusAnalyzer.res"
energy-budget-mj = 60.0
carbon-budget-mg = 12.0

[[functions]]
name = "getWithRetry"
source = "src/utils/Http.res"
energy-budget-mj = 20.0
carbon-budget-mg = 4.0

[carbon]
provider = "static"
region = "GB"
static-intensity = 200.0

[report]
format = "text"
include-recommendations = true
