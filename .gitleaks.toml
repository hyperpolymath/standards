#
# Gitleaks configuration — standards' own repo config.
#
# The shared allowlist lives in config/gitleaks/estate-baseline.toml so every
# repo in the estate can inherit it (see docs/GITLEAKS-ESTATE-BASELINE.adoc).
# This repo consumes it exactly as any consumer does -- deliberate dogfooding,
# so a change that breaks consumers breaks standards' own scan first.
#
# `[extend] path` resolves against the PROCESS working directory, not against
# this file's location (verified empirically). The scan runs from the repo
# root, so this relative path is correct.
#
# Add repo-local suppressions BELOW, never to the estate baseline, unless the
# entry is true for all 400+ repositories.

[extend]
path = "config/gitleaks/estate-baseline.toml"

# REPO-LOCAL SUPPRESSION — scripts/verify-regextarget-claim.sh
#
# That script exists to MEASURE how gitleaks treats allowlist regexes, so its
# body is nothing but fabricated `key : value` test vectors chosen to look like
# credentials to `generic-api-key`. It flags three of them (lines 50, 55, 115).
#
# A path entry, not a value regex, is the right instrument here, and it is the
# instrument config/gitleaks/estate-baseline.toml itself prescribes for a
# `generic-api-key` false positive: a PATH entry in the owning repository's own
# config, where the exemption is local and its justification sits beside the
# code. The baseline's warning that "a `paths` entry blinds the whole file"
# is accepted knowingly: this file is a test fixture for the scanner, no live
# credential can legitimately live in it, and its content is asserted by
# scripts/tests/ rather than trusted.
#
# This entry is deliberately NOT in the estate baseline: it is true for this
# repository only, and adding it there would blind 400+ repositories to any
# file that happened to share the name.
[allowlist]
description = "standards-local: the gitleaks regexTarget verification script is all fabricated test vectors"
paths = ['''^scripts/verify-regextarget-claim\.sh$''']
