#
# Gitleaks configuration — standards' own repo config.
#
# The shared allowlist lives in config/gitleaks/estate-baseline.toml so every
# repo in the estate can inherit it (see docs/GITLEAKS-ESTATE-BASELINE.adoc).
# This repo consumes it exactly as any consumer does -- deliberate dogfooding,
# so a change that breaks consumers breaks standards' own scan first.
#
# `[extend] path` resolves against the PROCESS working directory, not against
# this file's location (verified empirically). The scan runs from the repo
# root, so this relative path is correct.
#
# Add repo-local suppressions BELOW, never to the estate baseline, unless the
# entry is true for all 400+ repositories.

[extend]
path = "config/gitleaks/estate-baseline.toml"
