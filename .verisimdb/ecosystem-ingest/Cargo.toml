[package]
name = "ecosystem-ingest"
version = "0.1.0"
edition = "2021"
description = "Derive ecosystem-link octads from dependency manifests, emit A2ML"
license = "AGPL-3.0-or-later"
authors = ["Jonathan D.A. Jewell <j.d.a.jewell@open.ac.uk>"]

[[bin]]
name = "ecosystem-ingest"
path = "src/main.rs"

[dependencies]
walkdir = "2"

[profile.release]
opt-level = 3
lto = true
