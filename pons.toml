# SPDX-License-Identifier: MPL-2.0
# pons.toml — pons-asinorum configuration for the standards canon.
#
# Identity only, deliberately: scoped suppressions (suppress.allow entries
# with rule, path, reason, owner and expiry) are added here per finding as
# deep-recon triage produces them — never pre-emptively, and never as broad
# rule/path pairs (the tool rejects those anyway). Path exclusions for
# whole subtrees belong in .ponsignore, where they are visible as scope
# decisions rather than as finding-level silences.

[identity]
name = "standards"
aliases = ["hyperpolymath standards canon"]
