# Calibration fixture: one comment in every position class.
---
{
  name: "calibration",
  on: {
    push: {
      branches: ["main"],
    },
  },
  permissions: "read-all",
  # before-entry comment on jobs
  jobs: {
    build: {
      "runs-on": "ubuntu-latest", # key-trailing runner
      steps: [
        # before the first sequence item
        {
          uses: "actions/checkout@0123456789abcdef0123456789abcdef01234567", # v4.2.2
        },
        # between sequence items
        {
          name: "test",
          run: "echo ok", # trailing run
        },
      ],
    },
  },
}
# end of file
