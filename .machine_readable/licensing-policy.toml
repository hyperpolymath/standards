# SPDX-License-Identifier: MPL-2.0
# SPDX-FileCopyrightText: 2026 Jonathan Jewell (hyperpolymath)
#
# Machine-readable form of LICENCE-POLICY.adoc. Tools enforce from this;
# humans read the .adoc (the .adoc is the source of truth — keep in
# sync, do not diverge). NOT a REUSE per-file dep5 map: this encodes
# the RULES, not per-file claims.

schema = "hyperpolymath.licensing-policy/1"
revised = "2026-06-04"
note = "Sole-owner repos: code = MPL-2.0, prose docs = CC-BY-SA-4.0 (owner ruling 2026-06-04). PMPL is a narrow carve-out (3 named repos only), never the estate default. AGPL only for the son's co-developed repos. 007 out of scope. No automated/bulk SPDX edits."

[default]                                # Rule 1 — code/config/scripts
spdx = "MPL-2.0"
meaning = "Mozilla Public License 2.0"
scope = "all hyperpolymath original code, config, scripts (sole-owner repos)"
status = "the stated, legally-operative estate standard for code"

[default_docs]                           # Rule 1b — prose documentation
spdx = "CC-BY-SA-4.0"
meaning = "Creative Commons Attribution-ShareAlike 4.0 International"
scope = "narrative documentation (*.adoc, *.md) in sole-owner repos"
status = "owner ruling 2026-06-04 — docs are CC-BY-SA-4.0; code stays MPL-2.0"

[palimpsest_carveout]                    # Rule 2 — narrow, NOT the default
spdx = "PMPL-1.0-or-later"
applies = "EXACTLY three repos: palimpsest-license, palimpsest-plasma, consent-aware-http (the last prospectively)"
rule = "PMPL appears NOWHERE ELSE in the estate; standards itself is MPL-2.0 / CC-BY-SA-4.0 (see .claude/CLAUDE.md §License Policy)"

[platform_exception]                     # registries
spdx = "MPL-2.0"
applies = "crates.io / Hackage / npm and other OSI-only registries"
note = "explicit MPL-2.0 + comment '(MPL-2.0 required for [platform])'; compliance, not preference"

[exceptions.son]                         # Rule 3
spdx = "AGPL-3.0-or-later"
instances = ["IDApTIK", "Airborne Submarine Squadron (ASS)"]
permanent = true
open_question = "possible move to PAGPL-1.0-or-later (Palimpsest-AGPL) — owner ruling pending, not asserted"

[exceptions.repo_007]                    # Addendum A1 (overrides Rules 1-3 for 007)
handling = "OUT-OF-SCOPE"
reason = "full commercial dual-use; potentially dangerous to declare (export-control / hazardous-tech sensitive)"
rule = "never touch/normalise/label/add-SPDX/scan/report; surface to owner only"

[third_party]
rule = "preserve original SPDX exactly; never relicense; flag-not-edit"

[automation]                             # Addendum A2
allowed = false
rule = "no bulk/sed/script/agent licence-SPDX changes ever; remediation is manual, per-file, owner-only"
exception = "an agent may author NEW files with correct SPDX; a brand-new repo's own top-level LICENSE may be set"

[debt]                                   # Addendum A3 — the ONLY licence debt
type = "variant normalisation (manual, owner-driven)"
fix = "PMPL-1.0 -> PMPL-1.0-or-later (the only TRUE manual licence debt)"
note = "PMPL-1.0-or-later-or-later is NOT hand-typed debt — it is a scaffold-substituter artifact; see [scaffold_placeholder]"

[scaffold_placeholder]                   # Addendum A5 — NOT licence debt
sentinel = ["PLMP-1.0-or-later", "PMLP-1.0-or-later"]
classification = "unsubstituted scaffold placeholder (process bug) — NOT licence debt"
remediation = "re-run contractiles scaffold substitution; NEVER hand-edit as licence work"
family = "PMPL-1.0-or-later-or-later (doubled suffix) is the same scaffold-substituter family"
tripwire = "contractiles/must/Mustfile (groups with REPLACE-WITH-*)"

[guard]
location = "rsr-template-repo/.github/workflows/spdx-policy-guard.yml"
edits_files = false
tolerates = ["PMPL-*", "MPL-2.0", "CC-BY-SA-4.0"]
estate_family = ["MPL-2.0", "CC-BY-SA-4.0", "PMPL-1.0-or-later", "AGPL-3.0-or-later"]
fails_on = ["contradictory multi-SPDX in one file", "foreign licences outside the estate family"]
hard_fails_on = ["PLMP-/PMLP- as a real SPDX value (scaffold-placeholder leak)"]
warns_on = ["bare PMPL-1.0", "PMPL-1.0-or-later-or-later"]
