# SPDX-License-Identifier: MPL-2.0
# Offline tests for repo-guardian-fs manifest and session logic.
#
# This is a SEPARATE crate from repo-guardian-fs to avoid the broken fuse3
# dependency (fuse3 v0.7.3 fails to compile on Rust stable >= 1.80 due to
# removed features). The fuse3 dependency is only needed for the FUSE mount
# operations, not for the manifest parsing and session management logic.
#
# Run with: cargo test  (from this directory)
# Or from repo root: cargo test --manifest-path tests-offline/Cargo.toml

[package]
name = "repo-guardian-fs-tests"
version = "0.1.0"
edition = "2021"
authors = ["Jonathan D.A. Jewell <j.d.a.jewell@open.ac.uk>"]
description = "Offline unit tests for repo-guardian-fs manifest and session logic"
license = "PMPL-1.0-or-later"
publish = false

[dependencies]
anyhow = "1.0"
sha2 = "0.10"
tempfile = "3"
