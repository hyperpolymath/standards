# =============================================================================
# Docs - Deploy Documentation to GitHub Pages
# =============================================================================
# Builds and deploys documentation when changes are pushed to main.
#
# Deployment: GitHub Pages (static site)
# Source: Markdown files converted via Jekyll
#
# The site will be available at:
#   https://hyperpolymath.github.io/palimpsest-license/
# =============================================================================

name: Docs

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'GUIDES_v0.4/**'
      - 'LICENSES/**'
      - '**.md'
      - '_config.yml'
  workflow_dispatch:  # Allow manual trigger

permissions:
  contents: read
  pages: write
  id-token: write

# Only one deployment at a time
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------------------
  # Build - Generate static site
  # ---------------------------------------------------------------------------
  build:
    name: Build Documentation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Setup Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@44a6e6beabd48582f863aeeb6cb2151cc1716697 # v1
        with:
          source: ./
          destination: ./_site

      - name: Upload artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v4

  # ---------------------------------------------------------------------------
  # Deploy - Publish to GitHub Pages
  # ---------------------------------------------------------------------------
  deploy:
    name: Deploy to Pages
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
