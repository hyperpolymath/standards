#
# K9-SVC contractile validation.
#
# Extracted from boj-build.yml. `K9-SVC contractile validation` is a REQUIRED
# status check, but boj-build.yml declares only `push:` and `workflow_dispatch:`
# - it has no `pull_request:` trigger at all, so the context could never report
# on a pull request and every PR deadlocked waiting for it.
#
# It lives in its own file rather than gaining a `pull_request:` trigger inside
# boj-build.yml so that a required check is not coupled to the BoJ integration:
# a change to the BoJ trigger cannot alter whether this gate reports.
#
# The job name below is VERBATIM from the required-context list. A required
# context is matched against the emitted job name, so renaming it silently
# un-gates the branch.
name: K9-SVC Contractile Validation

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate-contractiles:
    name: K9-SVC contractile validation
    timeout-minutes: 10
    runs-on: ubuntu-latest
    # Needed only by the final step, which posts the validator's verdict to
    # the pull request. Log blobs are not reachable from every machine that
    # needs the result, so the result is published where it can be read.
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: K9-SVC Validation
        run: |
          set -euo pipefail
          echo "Running K9-SVC contractile validation..."
          # Real structural validation (no placeholder): every Mustfile check
          # must carry a severity and a means of discharge (run or verification).
          # A hollow check fails loudly. See scripts/check-mustfile-structure.sh
          # (unit-tested by scripts/tests/wave0-false-green-test.sh).
          bash scripts/check-mustfile-structure.sh .machine_readable/contractiles/must/must_praxis.deed

      - name: Mustfile Enforcement (execute the checks)
        run: |
          set -euo pipefail
          # Execute the Mustfile's `- run:` invariants — the mandatory checks
          # that were previously declared but never run by any CI job. A failing
          # critical/high check fails the build (fail loudly); warning-severity
          # failures are reported but non-blocking. See scripts/run-mustfile.sh.
          bash scripts/run-mustfile.sh .machine_readable/contractiles/must/must_praxis.deed

      - name: Contractile Check
        run: |
          set -euo pipefail
          echo "Checking contractile completeness..."
          index=".machine_readable/contractiles/contractiles_praxis.deed"
          if [ ! -f "$index" ]; then
            echo "❌ Contractile registry not found: $index"
            exit 1
          fi
          # Discover the live K9 contracts from the deed registry. The A2ML
          # index is archived and is not a live standard.
          mapfile -t files < <(grep -oE ':contract "[^"]+"' "$index" | sed 's/:contract "//;s/"$//' | sort -u)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "❌ No contractile contracts discovered in $index"
            exit 1
          fi
          missing=0
          for rel in "${files[@]}"; do
            if [ -f "$rel" ]; then
              echo "✅ $rel"
            else
              echo "❌ Missing: $rel"
              missing=$((missing + 1))
            fi
          done
          if [ "$missing" -gt 0 ]; then
            echo "❌ $missing contractile(s) missing"
            exit 1
          fi
          echo "✅ All ${#files[@]} contractiles present"
      # ── K9 CONTRACT CONFORMANCE (standards#1058, ruling D173) ──────────
      #
      # Everything above this line checks that contractile FILES EXIST. None of
      # it checked that a `.k9.ncl` file is a valid K9 component: the local hook
      # grepped for a line beginning `contract`, which no file in this repo has,
      # and ci-pipeline.yml excludes `*.k9.ncl` from Nickel entirely. So the
      # required check named "K9-SVC contractile validation" validated the
      # registry and never once read a pedigree.
      #
      # Nickel is installed here, pinned and sha256-verified with the SAME pin
      # as ci-pipeline.yml's `nickel` job — one version estate-wide, so a file
      # cannot typecheck in one lane and not in another.
      - name: Install Nickel (pinned, sha256-verified)
        env:
          NICKEL_VERSION: '1.18.0'
          NICKEL_SHA256: '9cba4dd65ae9915ec61f73033aafcff307a377665a83fd8f530df086763318cb'
        run: |
          set -euo pipefail
          URL="https://github.com/tweag/nickel/releases/download/${NICKEL_VERSION}/nickel-x86_64-linux"
          curl -sSfL --proto '=https' --proto-redir '=https' --tlsv1.2 --retry 3 -o "$RUNNER_TEMP/nickel" "$URL"
          echo "${NICKEL_SHA256}  ${RUNNER_TEMP}/nickel" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/nickel"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Install reporting runtime
        if: ${{ always() }}
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Reporting regression tests
        run: bun test 1-formats/k9/tools/conformance-report.test.mjs

      - name: Read previous compact report
        if: ${{ always() && github.event_name == 'pull_request' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" \
            | jq -r '[.[][] | select(.user.login == "github-actions[bot]" and (.body | contains("<!-- k9-contractile-report:")))] | last | .body // ""' \
            > "$RUNNER_TEMP/k9-previous.md"

      - name: Collect DEED and K9 evidence
        if: ${{ always() }}
        env:
          PR_NUMBER: ${{ github.event.pull_request.number || 'local' }}
          K9_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          K9_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          K9_PREVIOUS_REPORT: ${{ runner.temp }}/k9-previous.md
        run: |
          set -euo pipefail
          if command -v bun >/dev/null; then
            bun 1-formats/k9/tools/conformance-report.mjs
          else
            node 1-formats/k9/tools/conformance-report.mjs
          fi

      - name: Archive dated conformance evidence
        if: ${{ always() && env.K9_REPORT_DIR != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: conformance-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.K9_REPORT_DIR }}
          if-no-files-found: error
          retention-days: 90

      - name: Update the compact PR verdict
        if: ${{ always() && github.event_name == 'pull_request' && env.K9_REPORT_DIR != '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          comment_id="$(gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" \
            | jq -r '[.[][] | select(.user.login == "github-actions[bot]" and (.body | contains("<!-- k9-contractile-report:")))] | last | .id // ""')"
          jq -n --rawfile body "$K9_REPORT_DIR/report.md" '{body: $body}' > "$RUNNER_TEMP/k9-comment.json"
          if [ -n "$comment_id" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$comment_id" --input "$RUNNER_TEMP/k9-comment.json" >/dev/null
          else
            gh api -X POST "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" --input "$RUNNER_TEMP/k9-comment.json" >/dev/null
          fi
