# This workflow is managed by gh actions-lock.
# SPDX-License-Identifier: MPL-2.0
{
  name: "Labels",
  # Applies the canonical estate label set from .github/labels.json.
  #
  # Additive and idempotent by design: it CREATES missing labels and UPDATES
  # colour/description drift. It never deletes, and it never touches a label in
  # the `frozen` list -- those are applied by Dependabot / PR automation, or are
  # wired into triage.yml's exempt-issue-labels, and renaming them breaks things.
  #
  # jq is preinstalled on GitHub runners; PyYAML is not, which is why the payload
  # is JSON rather than YAML.
  #
  # ⚠ NO `uses:` ANYWHERE, DELIBERATELY. The estate enforces
  # .github/workflows/actions.lock, which is keyed BY WORKFLOW PATH: a workflow
  # the lock does not list is rejected before any step runs (startup_failure, and
  # therefore no check run at all). A dispatched workflow lands in repos whose
  # lock has not been regenerated, so it must not depend on any action.
  on: {
    workflow_dispatch: null,
    push: {
      paths: [
        ".github/labels.json",
      ],
    },
    schedule: [
      {
        cron: "23 4 1 * *", # monthly drift repair
      },
    ],
  },
  permissions: {
    issues: "write",
    contents: "read",
  },
  jobs: {
    sync: {
      runs-on: "ubuntu-latest",
      timeout-minutes: 10,
      steps: [
        {
          name: "Apply canonical labels",
          env: {
            GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}",
            # ⚠ LOAD-BEARING. This workflow deliberately does not check the repo
            # out (no `uses:`, so no actions.lock entry can drift), which means
            # `gh label create` / `gh label edit` have no git remote to infer a
            # target from. Without GH_REPO every mutation fails, and because the
            # errors used to be discarded the step still exited 0 reporting
            # "created=0 updated=0" -- a silent, estate-wide no-op.
            GH_REPO: "${{ github.repository }}",
          },
          run: "set -uo pipefail\nwork=$(mktemp -d); PAYLOAD=$work/labels.json\n\n# fetch instead of checking out -- no action means no lock entry to drift\ngh api \"repos/$GITHUB_REPOSITORY/contents/.github/labels.json?ref=$GITHUB_SHA\" \\\n  --jq '.content' 2>/dev/null | base64 -d > \"$PAYLOAD\" || true\n[ -s \"$PAYLOAD\" ] || { echo \"no .github/labels.json - nothing to do\"; exit 0; }\n\nmapfile -t FROZEN < <(jq -r '.frozen[]' \"$PAYLOAD\")\ncreated=0; updated=0; skipped=0; failed=0\n\nexisting=$(gh api \"repos/$GITHUB_REPOSITORY/labels\" --paginate \\\n             --jq '.[] | [.name, .color, (.description // \"\")] | @tsv')\n\nwhile IFS=$'\\t' read -r name color desc; do\n  [ -z \"$name\" ] && continue\n  frozen=0\n  for f in \"${FROZEN[@]}\"; do [ \"$f\" = \"$name\" ] && frozen=1 && break; done\n\n  cur=$(printf '%s\\n' \"$existing\" | awk -F'\\t' -v n=\"$name\" '$1==n{print;exit}')\n  if [ -z \"$cur\" ]; then\n    # A MISSING label is created even when frozen. \"Frozen\" protects a\n    # label's DEFINITION from being renamed or recoloured -- it was\n    # never meant to stop the label existing. Skipping creation broke\n    # `security`, the one canonical label that is also frozen: it was\n    # absent from 10 of 12 sampled repos, and label-triage drops any\n    # label the repo does not define, so every `security` finding was\n    # silently discarded estate-wide.\n    if err=$(gh label create \"$name\" --color \"$color\" \\\n               --description \"$desc\" 2>&1 >/dev/null); then\n      created=$((created+1)); sleep 0.4\n    else\n      echo \"  create failed: $name -- ${err:-unknown}\"; failed=$((failed+1))\n    fi\n  else\n    # Present AND frozen: leave it exactly as it is.\n    if [ \"$frozen\" -eq 1 ]; then skipped=$((skipped+1)); continue; fi\n    ccol=$(cut -f2 <<<\"$cur\"); cdesc=$(cut -f3- <<<\"$cur\")\n    if [ \"${ccol,,}\" != \"${color,,}\" ] || [ \"$cdesc\" != \"$desc\" ]; then\n      if err=$(gh label edit \"$name\" --color \"$color\" \\\n                 --description \"$desc\" 2>&1 >/dev/null); then\n        updated=$((updated+1)); sleep 0.4\n      else\n        echo \"  edit failed: $name -- ${err:-unknown}\"; failed=$((failed+1))\n      fi\n    fi\n  fi\ndone < <(jq -r '.labels[] | [.name, .color, .description] | @tsv' \"$PAYLOAD\")\n\necho \"created=$created updated=$updated frozen-skipped=$skipped failed=$failed\"\n\n# Fail ONLY on the misconfiguration shape: work was attempted, every\n# attempt failed. That is the silent-no-op signature. A single flaky\n# label must not turn the whole estate's CI red.\nif [ \"$failed\" -gt 0 ] && [ \"$((created + updated))\" -eq 0 ]; then\n  echo \"every label mutation failed - the sync did nothing. Check GH_REPO and token scope.\"\n  exit 1\nfi\nexit 0\n",
        },
      ],
    },
  },
}
