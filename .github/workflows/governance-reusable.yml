            GH_TOKEN: "${{ github.token }}",
          },
          run: "# Copy out and delete the checkout before scanning, so the standards\n# tree is never part of the caller's workspace (same idiom as the\n# allowlist preflight above).\ncp .standards-checkout/scripts/check-action-pins-resolve.sh \"$RUNNER_TEMP/\"\nrm -rf .standards-checkout\nbash \"$RUNNER_TEMP/check-action-pins-resolve.sh\" .\n",
        },
        {
          name: "Check for duplicate workflows",
          run: "if [ -f .github/workflows/codeql.yml ] && [ -f .github/workflows/codeql-analysis.yml ]; then\n  echo \"ERROR: Duplicate CodeQL workflows found\"; exit 1\nfi\necho \"No critical duplicates found\"\n",
        },
      ],
    },
    actions-lock-verify: {
      name: "Actions lockfile verify",
      runs-on: "${{ inputs.runs-on }}",
      timeout-minutes: 10,
      permissions: {
        contents: "read",
      },
      steps: [
        {
          name: "Checkout caller repository",
          uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1", # v7.0.1
          with: {
            repository: "${{ github.repository }}",
            ref: "${{ github.sha }}",
          },
        },
        {
          name: "Checkout standards for the lock gate",
          uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1", # v7.0.1
          with: {
            repository: "hyperpolymath/standards",
            # The reusable's OWN commit — the one the caller's `uses:` ref
            # resolved to — so the lock tooling is exactly what the caller
            # pinned, never older and never following `main`. This replaced a
            # hardcoded third pin that was one change behind by construction and
            # went stale twice (standards#946, then #1119);
            # scripts/check-lock-gate-pin-freshness.sh accepts only this
            # expression or a fresh 40-hex SHA.
            ref: "${{ job.workflow_sha }}",
            path: ".standards-lock",
            persist-credentials: false,
            sparse-checkout: "scripts/check-actions-lock-gate.sh\nscripts/update-actions-lock.sh\n.machine_readable/lock-allow.txt\n",
            sparse-checkout-cone-mode: false,
          },
        },
        {
          name: "Check locked or SHA-pinned actions",
          env: {
            GH_TOKEN: "${{ github.token }}",
          },
          run: "set -uo pipefail\n# Stage the gate, the verifier and the exemption ledger. When THIS\n# repository is standards, its own working tree already holds all\n# three (self-lint); every other caller uses the pinned checkout.\nif [ \"$GITHUB_REPOSITORY\" = hyperpolymath/standards ]; then\n  SRC=scripts\n  LEDGERSRC=.machine_readable\n  echo \"Using this repository's own gate + verifier + ledger (standards self-lint).\"\nelse\n  SRC=.standards-lock/scripts\n  LEDGERSRC=.standards-lock/.machine_readable\nfi\nfor f in check-actions-lock-gate.sh update-actions-lock.sh; do\n  if [ ! -f \"$SRC/$f\" ]; then\n    echo \"::error::actions-lock gate: $f not found in $SRC (pinned standards checkout failed?)\"\n    exit 1\n  fi\n  cp \"$SRC/$f\" \"$RUNNER_TEMP/$f\"\ndone\n# A MISSING ledger must not silently exempt everyone, nor silently\n# exempt no one. Stage an empty file and let the gate below print\n# the denominator it actually read — a skip is not a pass.\nif [ -f \"$LEDGERSRC/lock-allow.txt\" ]; then\n  cp \"$LEDGERSRC/lock-allow.txt\" \"$RUNNER_TEMP/lock-allow.txt\"\nelse\n  echo \"::warning::actions-lock exemption ledger not found; treating it as EMPTY (no repo is exempt).\"\n  : > \"$RUNNER_TEMP/lock-allow.txt\"\nfi\nrm -rf .standards-lock\n\n# ONE implementation of the lock/pin predicate, not two.\n#\n# The gate used to live inside workflow-lint with its own inline copy\n# of the logic. That copy matched `^[[:space:]]+uses:` — with no\n# `-?` — so it never saw `- uses: foo@v1`, the commonest step form,\n# and its green was therefore partly vacuous.\n# scripts/check-actions-lock-gate.sh uses\n# `^[[:space:]]+-?[[:space:]]*uses:` and is the tested implementation\n# (scripts/tests/check-actions-lock-gate-test.sh, 11/11).\n#\n# actions.lock is the authoritative immutable resolution for both\n# direct actions and their transitive dependencies. Do not also\n# rewrite direct refs to raw SHAs: gh actions-lock omits refs that\n# no tag or branch contains, and GitHub then rejects the workflow\n# at startup. Measured in oikosbot PR #78 on 2026-08-29: five\n# previously executable workflows became startup_failure after the\n# redundant direct-SHA conversion; restoring their locked version\n# refs made GitHub's native resolver accept them again.\nif [ -f .github/workflows/actions.lock ]; then\n  # Pinned: an unpinned install let a new verifier release change every\n  # caller's verdict overnight. Bump deliberately, with the gate tests.\n  gh extension install github/gh-actions-lock --pin v0.1.6\nfi\n\n# The gate delegates lockfile verification to the authoritative\n# verifier, staged into RUNNER_TEMP above.\nexport ACTIONS_LOCK_VERIFIER=\"$RUNNER_TEMP/update-actions-lock.sh\"\nbash \"$RUNNER_TEMP/check-actions-lock-gate.sh\"\nrc=$?\n\n# Shrink-only exemption ledger (.machine_readable/lock-allow.txt in\n# standards, guarded by scripts/check-exemption-ratchet.sh so it can\n# never grow without a `Ratchet-exception` trailer).\n#\n# Why a ledger and not a later date: the gate compares `date -u +%F`\n# against ENFORCE_ACTIONS_LOCK_FROM at RUNTIME, inside an artefact\n# that callers have already pinned by SHA. A date therefore fires\n# simultaneously across every bumped caller with no human action and\n# cannot be moved without re-bumping every pin. Measured 2026-09-22\n# (complete n=368 census of governance callers, `gh api` on default\n# branches): 200 carry actions.lock, 163 do not, 5 have no workflows\n# directory. The ledger makes that 163 an explicit, shrinking debt\n# instead of a cliff.\ntotal=$(grep -cve '^[[:space:]]*$' -e '^[[:space:]]*#' \"$RUNNER_TEMP/lock-allow.txt\" || [ $? -eq 1 ])\n: \"${total:=0}\"\n# The ledger excuses missing-lock debt ONLY (gate exit 3: lockless,\n# every ref pinned, grace window closed). Exit 1 is a LIVE\n# VIOLATION — unpinned refs or a verifier-rejected lock — and exit\n# 2 is infrastructure failure; neither is ledgerable, so `-ne 0`\n# here would wave real findings through with the debt.\nif [ \"$rc\" -eq 3 ] && grep -qxF \"$GITHUB_REPOSITORY\" \"$RUNNER_TEMP/lock-allow.txt\"; then\n  echo \"::notice::actions-lock debt is LEDGERED for $GITHUB_REPOSITORY (missing-lock only, gate exit 3).\"\n  echo \"lock debt: $GITHUB_REPOSITORY is 1 of $total ledgered repositories.\"\n  echo \"This exemption is shrink-only. Run scripts/update-actions-lock.sh, commit\"\n  echo \"the lockfile, and delete this repository's line from\"\n  echo \".machine_readable/lock-allow.txt in hyperpolymath/standards.\"\n  exit 0\nfi\n# Never a silent pass: state the denominator even when clean.\necho \"lock debt: $total ledgered repositories; $GITHUB_REPOSITORY is NOT among them.\"\nexit \"$rc\"\n",
        },
      ],
    },
    trusted-base: {
      name: "Trusted-base reduction policy",
      runs-on: "${{ inputs.runs-on }}",
      timeout-minutes: 10,
      permissions: {
        contents: "read",
      },
      steps: [
        {
          name: "Checkout caller repository",
          uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1", # v7.0.1
          with: {
            repository: "${{ github.repository }}",
            # Pin to the concrete event SHA (the PR merge commit on
            # pull_request, the pushed commit on push). Do NOT use
            # `ref: ${{ github.ref }}`: in a reusable workflow called from a
            # pull_request, github.ref is the named merge ref
            # `refs/pull/<n>/merge`, which actions/checkout cannot fetch
            # ("couldn't find remote ref refs/pull/<n>/merge") — it broke 8/10
            # governance jobs on every PR estate-wide. github.sha resolves to the
            # same merge commit but is always fetchable.
            ref: "${{ github.sha }}",
            path: "caller",
          },
        },
        {
          name: "Checkout standards (for the check script)",
          uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1", # v7.0.1
          with: {
            repository: "hyperpolymath/standards",
            ref: "${{ job.workflow_sha }}",
            path: "standards",
          },
        },
        {
          name: "Run trusted-base check on caller repo",
          run: "bash standards/scripts/check-trusted-base.sh caller\n",
        },
      ],
    },
    licence-consistency: {
      timeout-minutes: 10,
      name: "Licence consistency",
      runs-on: "${{ inputs.runs-on }}",
      permissions: {
        contents: "read",
      },
      steps: [
        {
          name: "Checkout caller repository",
          uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1", # v7.0.1
          with: {
            repository: "${{ github.repository }}",
            # Pin to the concrete event SHA (the PR merge commit on
            # pull_request, the pushed commit on push). Do NOT use
            # `ref: ${{ github.ref }}`: in a reusable workflow called from a
            # pull_request, github.ref is the named merge ref
            # `refs/pull/<n>/merge`, which actions/checkout cannot fetch
            # ("couldn't find remote ref refs/pull/<n>/merge") — it broke 8/10
            # governance jobs on every PR estate-wide. github.sha resolves to the
            # same merge commit but is always fetchable.
            ref: "${{ github.sha }}",
            path: "caller",
          },
        },
        {
          name: "Checkout standards (for the check script)",
          uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1", # v7.0.1
          with: {
            repository: "hyperpolymath/standards",
            ref: "${{ job.workflow_sha }}",
            path: "standards",
          },
        },
        {
          name: "Run licence-consistency check on caller repo",
          run: "bash standards/scripts/check-licence-consistency.sh caller\n",
        },
      ],
    },
    exemption-ratchet: {
      name: "Exemption ratchet",
      runs-on: "${{ inputs.runs-on }}",
      timeout-minutes: 5,
      permissions: {
        contents: "read",
      },
      # Only meaningful on a pull request: the check compares the ledgers against
      # a BASE. On push there is nothing to compare to, and a push-time run would
      # either be vacuous or compare against an arbitrary predecessor.
      if: "${{ github.event_name == 'pull_request' }}",
      steps: [
        {
          uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1", # v7.0.1
          with: {
            repository: "${{ github.repository }}",
            ref: "${{ github.sha }}",
            # Full history: the ratchet reads the ledgers at the base ref and
            # scans commit messages between base and HEAD for a declared
            # exception. A shallow clone has neither.
            fetch-depth: 0,
          },
        },
        {
          name: "Check out standards repo for shared scripts",
          uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1", # v7.0.1
          with: {
            repository: "hyperpolymath/standards",
            ref: "${{ job.workflow_sha }}",
            path: ".standards-checkout",
            sparse-checkout: "scripts\n",
            sparse-checkout-cone-mode: false,
          },
        },
        {
          name: "Exemption ratchet",
          run: "set -euo pipefail\n# Stage the script OUT of the scanned tree and delete the checkout,\n# so the ratchet only ever reads the CALLER's ledgers — standards has\n# ledgers of its own and they are not this repository's.\n# Both files: the ratchet calls count-ledger-entries.sh as a sibling,\n# and it has no fallback if the counter is missing — deliberately.\ncp .standards-checkout/scripts/check-exemption-ratchet.sh \\\n   .standards-checkout/scripts/count-ledger-entries.sh \"$RUNNER_TEMP/\"\nrm -rf .standards-checkout\nbash \"$RUNNER_TEMP/check-exemption-ratchet.sh\" \\\n  \"${{ github.event.pull_request.base.sha }}\"\n",
        },
      ],
    },
    debt-ratchet: {
      name: "Debt ratchet",
      runs-on: "${{ inputs.runs-on }}",
      timeout-minutes: 5,
      permissions: {
        contents: "read",
      },
      # Sibling to exemption-ratchet, and pull-request-only for the same reason:
      # the check compares ceilings against a BASE. The two govern different
      # populations — the exemption ratchet watches debt you have EXCUSED, this
      # one watches debt you have MEASURED.
      if: "${{ github.event_name == 'pull_request' }}",
      steps: [
        {
          uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1", # v7.0.1
          with: {
            repository: "${{ github.repository }}",
            ref: "${{ github.sha }}",
            # Full history: the ratchet reads the Debtfile at the base ref and
            # scans commit messages between base and HEAD for a declared
            # exception. A shallow clone has neither.
            fetch-depth: 0,
          },
        },
        {
          name: "Check out standards repo for shared scripts",
          uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1", # v7.0.1
          with: {
            repository: "hyperpolymath/standards",
            ref: "${{ job.workflow_sha }}",
            path: ".standards-checkout",
            sparse-checkout: "scripts\n",
            sparse-checkout-cone-mode: false,
          },
        },
        {
          name: "Debt ratchet",
          run: "set -euo pipefail\n# Which copy of the scripts do we run?\n#\n# ⚠ BOOTSTRAP TRAP. A gate that fetches its own script from `main`\n#   cannot run on the pull request that INTRODUCES that script — the\n#   sparse checkout of main has no such file and the `cp` fails. This\n#   job failed exactly that way on the PR that added it, and the same\n#   shape has bitten hypatia's self-gating before.\n#\n#   So when the repository under test IS standards, run the scripts\n#   from the PR's own tree. The guard is on the repository name and\n#   not on file existence: a consumer repo that happened to contain a\n#   file at scripts/check-debt-ratchet.sh must NOT be able to\n#   substitute its own gate.\nif [ \"${{ github.repository }}\" = \"hyperpolymath/standards\" ]; then\n  cp scripts/check-debt-ratchet.sh \\\n     scripts/check-debtfile-structure.sh \"$RUNNER_TEMP/\"\nelse\n  cp .standards-checkout/scripts/check-debt-ratchet.sh \\\n     .standards-checkout/scripts/check-debtfile-structure.sh \"$RUNNER_TEMP/\"\nfi\n# Stage the scripts OUT of the scanned tree and delete the checkout,\n# so the ratchet only ever reads the CALLER's Debtfile — standards\n# has one of its own and it is not this repository's.\nrm -rf .standards-checkout\n\n# A repo with no Debtfile is not in violation — adoption is opt-in.\n# But a repo that HAS one must have a well-formed one, or the ratchet\n# would be comparing ceilings it could not parse.\nif [ -f .machine_readable/Debtfile.a2ml ]; then\n  bash \"$RUNNER_TEMP/check-debtfile-structure.sh\"\nfi\nbash \"$RUNNER_TEMP/check-debt-ratchet.sh\" \\\n  \"${{ github.event.pull_request.base.sha }}\"\n",
        },
      ],
    },
  },
}
