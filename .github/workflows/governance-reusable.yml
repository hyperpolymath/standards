          # hypatia: allow research_extensions/RE005 -- deliberate fail-closed: see comment above.
          continue-on-error: true,
        },
        {
          name: "Duplicate YAML keys in workflows",
          run: "# GitHub Actions REJECTS a workflow with duplicate keys: the run is\n# `failure` with no jobs, no log and no check run. Nothing else here\n# can see it, because yaml.safe_load silently keeps the LAST\n# duplicate and reports success — so the file \"parses\" and every\n# other lint passes. Measured 2026-08-05: nine workflows in hypatia\n# were dead this way, including a CodeQL workflow with zero\n# successful runs in its entire lifetime.\nset -euo pipefail\nSCRIPT=\".standards-dupkey/scripts/check-workflow-duplicate-keys.sh\"\n# Self-hosting fallback: when THIS repository is standards, its own\n# working tree already holds the script, and during a rename that copy\n# is the only correct one — the pinned main checkout still has the old\n# name. Preferring the fetched copy keeps every other caller on the\n# canonical version.\nif [ ! -f \"$SCRIPT\" ] && [ -f scripts/check-workflow-duplicate-keys.sh ]; then\n  SCRIPT=\"scripts/check-workflow-duplicate-keys.sh\"\n  echo \"Using this repository's own copy (standards self-lint).\"\nfi\nif [ ! -f \"$SCRIPT\" ]; then\n  echo \"::error::duplicate-key checker not found — neither fetched from\" \\\n       \"standards@main nor present locally.\"\n  exit 1\nfi\ncp \"$SCRIPT\" \"$RUNNER_TEMP/dupkeys.sh\"\n# NOTE: the actions-lock gate used to be staged here too. It is its\n# own job now (`actions-lock-verify`, its own required context per\n# the 2026-09-02 regularisation spec §6.2) — see that job below.\nrm -rf .standards-dupkey\nbash \"$RUNNER_TEMP/dupkeys.sh\" .github/workflows\n",
        },
        {
          name: "Check SPDX headers + permissions",
          run: "failed=0\n# The permissions verdict is read with yq (YAML-POLICY Y-1): the old\n# `grep -q \"^permissions:\"` FALSELY FAILED every KYAML workflow,\n# whose keys sit indented inside `{ … }`. yq ships on GitHub-hosted\n# Ubuntu; a runner without it (inputs.runs-on) keeps the old line\n# test, which is still right for block-style files, and says so.\nhave_yq=1\ncommand -v yq >/dev/null 2>&1 || {\n  have_yq=0\n  echo \"::warning::yq not on this runner -- permissions read by line grep; a KYAML workflow will be misreported\"\n}\nfor file in .github/workflows/*.yml .github/workflows/*.yaml; do\n  [ -f \"$file\" ] || continue\n  # ⚠ SCAN THE HEADER BLOCK, NOT LINE 1. REUSE places the identifier\n  # anywhere in a file's leading comment block, and `gh actions-lock`\n  # INSERTS `# This workflow is managed by gh actions-lock.` at line 1\n  # whenever it mints a lockfile — so a line-1 test fights the estate's\n  # own tool and re-fails every time a lockfile is refreshed.\n  #\n  # Measured 2026-08-07: it reported 27 hypatia workflows and 13 more\n  # elsewhere as missing a header they all had, and \"fixing\" that by\n  # prepending a default MIS-LICENSED three files (PMPL-1.0-or-later\n  # shadowed by MPL-2.0) before it was caught.\n  #\n  # The leading run of comment lines is read, tolerating a YAML\n  # document marker. A licence declared there is declared.\n  if ! awk '/^---[[:space:]]*$/ { next } /^#/ { print; next } { exit }' \"$file\" \\\n       | grep -q \"^# SPDX-License-Identifier:\"; then\n    echo \"ERROR: $file has no SPDX-License-Identifier in its header comment block\"; failed=1\n  fi\n  if [ \"$have_yq\" -eq 1 ]; then\n    if ! verdict=\"$(yq 'has(\"permissions\")' \"$file\" 2>&1)\"; then\n      echo \"ERROR: $file is not parseable as YAML: $verdict\"; failed=1\n    elif [ \"$verdict\" != \"true\" ]; then\n      echo \"ERROR: $file missing top-level 'permissions:' declaration\"; failed=1\n    fi\n  elif ! grep -q \"^permissions:\" \"$file\"; then\n    echo \"ERROR: $file missing top-level 'permissions:' declaration\"; failed=1\n  fi\ndone\n[ $failed -eq 1 ] && { echo \"Add SPDX header + permissions:\"; exit 1; }\necho \"All workflows have SPDX headers + permissions\"\n",
        },
        # The actions-lock-verify job proves a pin has the right SHAPE. It cannot
        # prove the SHA EXISTS — a fabricated 40-hex string passes it.
        # Measured 2026-07-28:
        # 112 of 613 unique estate pins (18%) do not resolve, in 876 committed
        # files. An unresolvable `uses:` yields NO check run, so those repos look
        # green while the job never ran. This step closes that gap.
        {
          name: "Checkout standards for the pin-existence gate",
          uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1", # v7.0.1
          with: {
            repository: "hyperpolymath/standards",
            # Immutable pin, for the same reason as the policy-helper checkout
            # above: following `main` lets one standards push change the
            # behaviour of every already-pinned caller with no review.
            ref: "317101e03b8fe642589498f4bdb84541ab466062",
            path: ".standards-checkout",
            persist-credentials: false,
            sparse-checkout: "scripts\n",
            sparse-checkout-cone-mode: false,
          },
        },
        {
          name: "Check action pins resolve upstream",
