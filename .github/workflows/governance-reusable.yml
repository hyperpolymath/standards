            # Pin to the concrete event SHA (the PR merge commit on
            # pull_request, the pushed commit on push). Do NOT use
            # `ref: ${{ github.ref }}`: in a reusable workflow called from a
            # pull_request, github.ref is the named merge ref
            # `refs/pull/<n>/merge`, which actions/checkout cannot fetch
            # ("couldn't find remote ref refs/pull/<n>/merge") — it broke 8/10
            # governance jobs on every PR estate-wide. github.sha resolves to the
            # same merge commit but is always fetchable.
            ref: "${{ github.sha }}",
          },
        },
        {
          name: "RFC 9116 security.txt validation",
          run: "SECTXT=\"\"\n[ -f \".well-known/security.txt\" ] && SECTXT=\".well-known/security.txt\"\n[ -f \"security.txt\" ] && SECTXT=\"security.txt\"\nif [ -z \"$SECTXT\" ]; then\n  echo \"::warning::No security.txt found.\"\n  exit 0\nfi\ngrep -q \"^Contact:\" \"$SECTXT\" || { echo \"::error::Missing Contact field\"; exit 1; }\nif ! grep -q \"^Expires:\" \"$SECTXT\"; then\n  echo \"::error::Missing Expires field\"\n  exit 1\nfi\nEXPIRES=$(grep \"^Expires:\" \"$SECTXT\" | cut -d: -f2- | tr -d ' ' | head -2)\nif date -d \"$EXPIRES\" > /dev/null 2>&1; then\n  DAYS=$(( ($(date -d \"$EXPIRES\" +%s) - $(date +%s)) / 86400 ))\n  if [ $DAYS -lt 0 ]; then\n    echo \"::error::security.txt EXPIRED\"\n    exit 1\n  elif [ $DAYS -lt 30 ]; then\n    echo \"::warning::security.txt expires in $DAYS days\"\n  else\n    echo \"✅ security.txt valid ($DAYS days)\"\n  fi\nfi\n",
        },
        {
          name: "RSR well-known compliance",
