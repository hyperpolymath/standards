# This workflow is managed by gh actions-lock.
# SPDX-License-Identifier: MPL-2.0
# This workflow is managed by gh actions-lock.
# Governance checks for hyperpolymath repositories — Reusable Workflow
{
  name: "Governance Reusable Workflow",
  on: {
    workflow_call: {
      inputs: {
        hypatia-ref: {
          description: "Hypatia commit the baseline job builds, as a 40-hex SHA, or \"HEAD\" for a canary run. Kept in step with hypatia-scan-reusable.yml's default; a floating HEAD here broke every baseline caller when hypatia#895 changed the emitted severity of `warn` findings.",
          type: "string",
          default: "51ab6496bf47e30a0576d503df31fec30f3cfe56",
        },
        runs-on: {
          description: "Runner label for all governance jobs",
          type: "string",
          required: false,
          default: "ubuntu-latest",
        },
      },
      secrets: {
        HYPATIA_SCAN_PAT: {
          description: "Fine-grained token with repository Administration read access",
          required: false,
        },
      },
    },
  },
  permissions: {
    actions: "read",
    contents: "read",
  },
  jobs: {
    workflow-staleness: {
      name: "Check Workflow Staleness",
      runs-on: "${{ inputs.runs-on }}",
      timeout-minutes: 10,
      outputs: {
        has_baseline: "${{ steps.check.outputs.has_baseline }}",
      },
      steps: [
        {
          name: "Checkout caller repository",
          uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1", # v7.0.1
        },
        {
          name: "Check baseline existence",
          id: "check",
          run: "if [ -f \".hypatia-baseline.json\" ]; then\n  echo \"has_baseline=true\" >> $GITHUB_OUTPUT\nelse\n  echo \"has_baseline=false\" >> $GITHUB_OUTPUT\nfi\n",
        },
        {
          name: "Checkout pinned standards history",
          uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1", # v7.0.1
          with: {
            repository: "hyperpolymath/standards",
            # The gate needs the full graph for ancestry and age checks, but its
            # script must come from the exact reusable commit rather than moving
            # main. This also lets a Standards PR test its own validator change.
            ref: "${{ job.workflow_sha }}",
            path: ".standards-history",
            fetch-depth: 0,
            filter: "tree:0",
            persist-credentials: false,
          },
        },
        {
          name: "Run staleness check",
          env: {
            # The gate confirms a pin server-side before ever accusing it of being
            # forged, and before accepting a deny-list negative from a clone it
            # cannot trust. Unauthenticated that is 60 requests/hour per runner IP;
            # exhausting it makes the gate degrade to ::warning (loudly — it never
            # silently passes, see check-workflow-staleness.sh). A token removes
            # the cliff entirely. Note this only reaches a consumer once it re-pins
            # past this commit: the script comes from standards HEAD, but the job
            # definition comes from whatever SHA the consumer pins.
            GITHUB_TOKEN: "${{ github.token }}",
            STALENESS_STANDARDS_DIR: "${{ github.workspace }}/.standards-history",
          },
          run: "bash .standards-history/scripts/check-workflow-staleness.sh .\n",
        },
      ],
    },
    uuid-v7-conformance: {
      name: "UUID v7 conformance",
      runs-on: "${{ inputs.runs-on }}",
      timeout-minutes: 10,
      steps: [
        {
          name: "Checkout caller repository",
          uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1", # v7.0.1
          with: {
            fetch-depth: 1,
            persist-credentials: false,
          },
        },
        {
          name: "Checkout UUID v7 validator",
          uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1", # v7.0.1
          with: {
            repository: "hyperpolymath/standards",
            ref: "${{ job.workflow_sha }}",
            path: ".standards-uuid",
            sparse-checkout: "scripts/check-uuid-v7.sh",
            sparse-checkout-cone-mode: false,
            persist-credentials: false,
          },
        },
        {
          name: "Reject non-v7 UUID literals",
          run: "chmod +x .standards-uuid/scripts/check-uuid-v7.sh\n.standards-uuid/scripts/check-uuid-v7.sh .\n",
        },
      ],
    },
    allowlist-preflight: {
      name: "Allowlist Preflight",
      runs-on: "${{ inputs.runs-on }}",
      timeout-minutes: 5,
      permissions: {
        contents: "read",
      },
      steps: [
        {
          name: "Checkout caller repository",
          uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1", # v7.0.1
          with: {
            repository: "${{ github.repository }}",
            ref: "${{ github.sha }}",
          },
        },
        {
          name: "Checkout standards for the allowlist gate",
          uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1", # v7.0.1
          with: {
            repository: "hyperpolymath/standards",
            # Exact commit of this reusable workflow. This preserves consumer
            # pin semantics and lets a standards PR test its own scripts.
            ref: "${{ job.workflow_sha }}",
            path: ".standards-checkout",
            sparse-checkout: "rhodium-standard-repositories/actions-allowlist\nscripts\n",
            sparse-checkout-cone-mode: false,
          },
        },
        {
          name: "Run tree allowlist preflight check",
          run: "# Bootstrap rule: standards must test the scripts from its PR tree;\n# consumers use the canonical copies checked out from standards.\nif [ \"$GITHUB_REPOSITORY\" = hyperpolymath/standards ]; then\n  cp scripts/check-actions-policy.sh scripts/check-allowed-actions.sh \"$RUNNER_TEMP/\"\n  cp rhodium-standard-repositories/actions-allowlist/allowed-actions.json \\\n     \"$RUNNER_TEMP/allowed-actions.json\"\nelse\n  cp .standards-checkout/scripts/check-actions-policy.sh \\\n     .standards-checkout/scripts/check-allowed-actions.sh \"$RUNNER_TEMP/\"\n  cp .standards-checkout/rhodium-standard-repositories/actions-allowlist/allowed-actions.json \\\n     \"$RUNNER_TEMP/allowed-actions.json\"\nfi\nbash \"$RUNNER_TEMP/check-allowed-actions.sh\" \\\n  \"$RUNNER_TEMP/allowed-actions.json\" .github/workflows\nrm -rf .standards-checkout\n",
        },
      ],
    },
    actions-policy-live: {
      name: "Live Actions policy (credentialed advisory)",
      runs-on: "${{ inputs.runs-on }}",
      timeout-minutes: 5,
      permissions: {
        contents: "read",
      },
      steps: [
        {
          name: "Checkout standards for the live policy gate",
          uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1", # v7.0.1
          with: {
            repository: "hyperpolymath/standards",
            ref: "${{ job.workflow_sha }}",
            path: ".standards-checkout",
            sparse-checkout: "rhodium-standard-repositories/actions-allowlist\nscripts/check-actions-policy.sh\n",
            sparse-checkout-cone-mode: false,
          },
        },
        {
          name: "Report unavailable live policy credential",
          env: {
            GH_TOKEN: "${{ secrets.HYPATIA_SCAN_PAT }}",
          },
          if: "${{ env.GH_TOKEN == '' }}",
          run: "echo \"::notice::Live Actions policy was not evaluated: HYPATIA_SCAN_PAT was not supplied by the caller. The separate tree allowlist gate still ran.\"\n# shellcheck disable=SC2016\nprintf '%s\\n' \\\n  '### Live Actions policy not evaluated' \\\n  '' \\\n  'The caller did not supply `HYPATIA_SCAN_PAT`. This advisory job' \\\n  'does not claim that the repository Administration setting passed.' \\\n  'The independent tree allowlist preflight remains enforced.' \\\n  >> \"$GITHUB_STEP_SUMMARY\"\n",
        },
        {
          name: "Check live Actions policy",
          env: {
            # The ordinary job token cannot read the repository Administration
            # endpoint. When a caller deliberately supplies this credential, an
            # API/authentication failure or real policy violation remains red.
            GH_TOKEN: "${{ secrets.HYPATIA_SCAN_PAT }}",
          },
          if: "${{ env.GH_TOKEN != '' }}",
          run: "set +e\nbash .standards-checkout/scripts/check-actions-policy.sh \\\n  \"$GITHUB_REPOSITORY\" \\\n  .standards-checkout/rhodium-standard-repositories/actions-allowlist/allowed-actions.json\nrc=$?\nset -e\nif [ \"$rc\" -eq 3 ]; then\n  echo \"::notice::Live Actions policy was not evaluated: the supplied credential could not read the Administration endpoint.\"\n  printf '%s\\n' \\\n    '### Live Actions policy not evaluated' \\\n    '' \\\n    'A credential was supplied, but the Administration API was unavailable.' \\\n    'No live-policy pass is claimed; rotate or re-authorise the credential.' \\\n    >> \"$GITHUB_STEP_SUMMARY\"\n  exit 0\nfi\nexit \"$rc\"\n",
        },
      ],
    },
    validate-hypatia-baseline: {
      name: "Validate Hypatia Baseline",
      needs: "workflow-staleness",
      # NOTE: deliberately NO job-level `if:`. This context is REQUIRED by branch
      # protection, and a skipped job never satisfies a required context — so a
      # repo without a baseline blocked forever, by construction. The job now
      # always runs; the EXPENSIVE steps are guarded individually, so it still
      # costs nothing when there is no baseline to validate.
      runs-on: "${{ inputs.runs-on }}",
      timeout-minutes: 15,
      steps: [
        {
          name: "Checkout caller repository",
          if: "needs.workflow-staleness.outputs.has_baseline == 'true'",
          uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1", # v7.0.1
          with: {
            fetch-depth: 0,
          },
        },
        {
          name: "Setup Elixir for Hypatia scanner",
          if: "needs.workflow-staleness.outputs.has_baseline == 'true'",
          uses: "erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124", # v1.24.1
          with: {
            elixir-version: "1.19.4",
            otp-version: "28.3",
          },
        },
        {
          name: "Resolve Hypatia scanner commit",
          if: "needs.workflow-staleness.outputs.has_baseline == 'true'",
          id: "hypatia-rev",
          env: {
            HYPATIA_REF: "${{ inputs.hypatia-ref }}",
          },
          run: "# Resolved before the cache step because cache restore happens before\n# the clone, so the key must hash the commit, not a cloned tree.\nif [ \"$HYPATIA_REF\" = \"HEAD\" ]; then\n  sha=$(git ls-remote https://github.com/hyperpolymath/hypatia.git HEAD | cut -f1)\nelse\n  sha=\"$HYPATIA_REF\"\nfi\nif [[ ! \"$sha\" =~ ^[0-9a-f]{40}$ ]]; then\n  echo \"ERROR: hypatia-ref must be a 40-hex commit SHA or HEAD (got '$HYPATIA_REF')\" >&2\n  exit 1\nfi\necho \"sha=$sha\" >> \"$GITHUB_OUTPUT\"\necho \"Resolved hypatia scanner commit: $sha\"\n",
        },
        {
          name: "Cache Hex/Mix and Scanner Build",
          if: "needs.workflow-staleness.outputs.has_baseline == 'true'",
          uses: "actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9", # v6.1.0
          with: {
            path: "~/.mix\n~/.hex\n~/hypatia\n",
            # Source-pinned key: when Hypatia main advances, the SHA changes, the
            # cache misses, and the clone + escript build below re-run instead of
            # restoring a stale binary. The old keyless `...-build` key meant the
            # first scanner ever cached was reused forever, so baseline validation
            # ran against a stale ruleset. No restore-keys on purpose — a partial
            # restore would repopulate ~/hypatia and the guards below would skip
            # the rebuild, reintroducing the staleness.
            key: "hypatia-scanner-v4-${{ runner.os }}-${{ steps.hypatia-rev.outputs.sha }}",
          },
        },
        {
          name: "Check out resolved Hypatia commit",
          if: "needs.workflow-staleness.outputs.has_baseline == 'true'",
          env: {
            HYPATIA_SHA: "${{ steps.hypatia-rev.outputs.sha }}",
          },
          run: "set -euo pipefail\nif [ ! -d \"$HOME/hypatia\" ]; then\n  git init \"$HOME/hypatia\"\n  git -C \"$HOME/hypatia\" remote add origin https://github.com/hyperpolymath/hypatia.git\n  git -C \"$HOME/hypatia\" fetch --depth 1 origin \"$HYPATIA_SHA\"\n  git -C \"$HOME/hypatia\" checkout --detach FETCH_HEAD\nfi\nACTUAL_SHA=$(git -C \"$HOME/hypatia\" rev-parse HEAD)\nif [ \"$ACTUAL_SHA\" != \"$HYPATIA_SHA\" ]; then\n  echo \"::error::Hypatia cached source does not match the resolved commit\"\n  exit 1\nfi\n",
        },
        {
          name: "Build Hypatia scanner",
          if: "needs.workflow-staleness.outputs.has_baseline == 'true'",
          run: "cd \"$HOME/hypatia\"\nif [ ! -x hypatia ]; then\n  if ! (mix deps.get && mix escript.build); then\n    echo \"::error::Hypatia scanner build failed at commit $(git rev-parse HEAD) — see upstream hyperpolymath/hypatia\"\n    exit 1\n  fi\nfi\nif [ ! -x hypatia ]; then\n  echo \"::error::Hypatia scanner binary is missing after build\"\n  exit 1\nfi\n",
        },
        # A reusable workflow only auto-checks-out its own YAML, not sibling
        # scripts. Sparse-check-out standards' scripts/ to get apply-baseline.sh,
        # mirroring the language-policy job below. Pinned to job.workflow_sha (this
        # reusable's own standards commit), NOT main: a script fetched from main
        # changed every pinned caller's verdict on each standards push. (Unlike
        # github.workflow_sha, which is the caller's SHA, job.workflow_sha is ours.)
        {
          name: "Check out standards for the baseline filter",
          if: "needs.workflow-staleness.outputs.has_baseline == 'true'",
          uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1", # v7.0.1
          with: {
            repository: "hyperpolymath/standards",
            ref: "${{ job.workflow_sha }}",
            path: ".standards-checkout",
            sparse-checkout: "scripts\n",
            sparse-checkout-cone-mode: false,
          },
        },
        {
          name: "Run Hypatia scan (Baseline validation)",
          if: "needs.workflow-staleness.outputs.has_baseline == 'true'",
          env: {
            # Preserve the historical strictness: fail on ANY finding not
            # acknowledged by .hypatia-baseline.json (not just >= high). Set to
            # 'high' to only block on high/critical.
            BLOCKING_THRESHOLD: "info",
          },
          run: "echo \"Scanning repository: ${{ github.repository }} (checking baseline)\"\n# Move the baseline filter OUT of the scanned tree, then delete the\n# standards checkout, so `hypatia scan .` only ever sees the CALLER's\n# own files. Without this, `.standards-checkout/` (the tooling we\n# checked out to get apply-baseline.sh) is itself scanned, and\n# standards' own files get reported as the caller's findings (a banned\n# `.ts`, `shell_download` bootstrap.sh scripts, etc.).\n# Prefer the CALLER's own scripts/apply-baseline.sh when present\n# (self-lint: standards validating itself must run the tree under\n# test, not main's copy — a new baseline severity the main-pinned\n# script doesn't know would fail closed here while passing\n# everywhere else). Consumers without the script keep the\n# main-pinned fallback.\nif [ -f scripts/apply-baseline.sh ]; then\n  cp scripts/apply-baseline.sh \"$RUNNER_TEMP/apply-baseline.sh\"\nelse\n  cp .standards-checkout/scripts/apply-baseline.sh \"$RUNNER_TEMP/apply-baseline.sh\"\nfi\nrm -rf .standards-checkout\n# hypatia's `scan` exits non-zero whenever it finds anything — that is\n# by design, and under `bash -e` it would abort this step at this line,\n# before the baseline filter (the real gate) ever runs. Tolerate the\n# scan's own exit code…\nHYPATIA_FORMAT=json \"$HOME/hypatia/hypatia-cli.sh\" scan . > hypatia-findings.raw.json || true\n# …but never swallow a genuine scanner crash into a false pass: require a\n# valid JSON array before trusting the output as \"the findings\".\nif ! jq -e 'type == \"array\"' hypatia-findings.raw.json >/dev/null 2>&1; then\n  echo \"::error::hypatia scan did not produce a valid JSON findings array (scanner error, not a baseline result)\"\n  exit 1\nfi\n\n# Relativize finding paths before matching. Hypatia's honest_completion\n# and code_safety modules emit ABSOLUTE host paths in `.file`\n# (Path.expand(repo)), while .hypatia-baseline.json uses repo-relative\n# paths per the schema + docs/HYPATIA-BASELINE-FORMAT.adoc. Strip the\n# workspace prefix so baseline file/file_pattern entries can match, and\n# map the repo root itself to \".\" so root-scoped findings (no_tests)\n# match. Upstream fix tracked in hypatia#566; this is the stopgap.\njq --arg root \"$PWD\" '\n  map(if (.file? // \"\") == $root then .file = \".\"\n      elif (.file? // \"\") | startswith($root + \"/\")\n      then .file = (.file | ltrimstr($root + \"/\"))\n      else . end)\n' hypatia-findings.raw.json > hypatia-findings.json\n\n# Filter against the per-repo baseline. apply-baseline.sh KEEPS every\n# finding not matched by an active (non-expired) baseline entry — so a\n# genuinely new finding still fails the gate (no silent-green) — and\n# suppresses only exact matches. Exits non-zero iff a kept finding is at\n# or above BLOCKING_THRESHOLD. (Validated against synthetic fixtures;\n# see the PR description.)\nbash \"$RUNNER_TEMP/apply-baseline.sh\" \\\n  hypatia-findings.json .hypatia-baseline.json blocking\n",
        },
        {
          name: "No baseline to validate",
          if: "needs.workflow-staleness.outputs.has_baseline != 'true'",
          run: "echo \"No .hypatia-baseline.json in this repo — nothing to validate.\"\necho \"The job still reports success so the required context is satisfied.\"\n",
        },
      ],
    },
    language-policy: {
      name: "Language / package anti-pattern policy",
      runs-on: "${{ inputs.runs-on }}",
      timeout-minutes: 10,
      permissions: {
        contents: "read",
      },
      steps: [
        {
          uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1", # v7.0.1
          with: {
            repository: "${{ github.repository }}",
            # Pin to the concrete event SHA (the PR merge commit on
            # pull_request, the pushed commit on push). Do NOT use
            # `ref: ${{ github.ref }}`: in a reusable workflow called from a
            # pull_request, github.ref is the named merge ref
            # `refs/pull/<n>/merge`, which actions/checkout cannot fetch
            # ("couldn't find remote ref refs/pull/<n>/merge") — it broke 8/10
            # governance jobs on every PR estate-wide. github.sha resolves to the
            # same merge commit but is always fetchable.
            ref: "${{ github.sha }}",
          },
        },
        # Estate language policy bans Python with no exceptions (CLAUDE.md
        # Language Policy; SaltStack exception removed 2026-01-03). The
        # previous in-line `python3 << PYEOF` heredoc made this very gate a
        # self-referential violation — same structural class as the CSA001
        # self-loop fixed in hypatia#328. Eradicated by porting the logic to
        # a script that lives in this standards repo.
        #
        # Implementation note: a reusable workflow only auto-checks-out its
        # YAML, not sibling files in its repo. So we explicitly check out
        # this repo into `.standards-checkout/`, then run the script from
        # there.
        #
        # The checkout is pinned to an immutable standards commit, not `main`.
        # `github.workflow_sha` cannot serve: it resolves to the caller repo's
        # commit SHA (not standards'), so the fetch fails with exit 128
        # ("No commit found for SHA"). Hence a literal SHA, bumped in the same
        # PR as any helper change. scripts/tests/governance-reusable-contract-
        # test.sh asserts exactly this with `ref: [0-9a-f]{40}`: following
        # moving `main` would let one standards push silently change the
        # behaviour of every already-pinned caller, with no review in their
        # repos.
        {
          name: "Checkout the pinned Standards policy helpers",
          uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1", # v7.0.1
          with: {
            repository: "hyperpolymath/standards",
            ref: "317101e03b8fe642589498f4bdb84541ab466062",
            path: ".standards-checkout",
            # Sparse-checkout only the scripts dir to keep this fast.
            sparse-checkout: "scripts\n",
            sparse-checkout-cone-mode: false,
          },
        },
        {
          name: "Check for TypeScript",
          # Read-only execution; never writes outside the runner workspace.
          #
          # Runs `scripts/check-ts-allowlist.sh`, replacing the
          # AffineScript-compiled `check-ts-allowlist.deno.js`. That artefact
          # existed only to be fed to `deno run`, which forced a
          # `denoland/setup-deno` install onto a REQUIRED context in every
          # estate repo. The shell implementation is behaviourally equivalent
          # (scripts/tests/check-ts-allowlist-test.sh, 18/18) and needs no
          # runtime installed at all. Estate policy retires Deno in favour of
          # bun — see LANGUAGE-POLICY.adoc §1.
          #
          # The source/compile drift check that used to sit here was removed
          # with the .deno.js it compared against: `affinescript compile` is
          # unavailable on the runner, so the step could only ever emit
          # `::warning::`, which cannot fail a job — a vacuous gate.
          run: "bash .standards-checkout/scripts/check-ts-allowlist.sh",
        },
        # Shared escape hatch for the banned-language-file checks below.
        # Honours three exemption mechanisms (see
        # standards/docs/EXEMPTION-MECHANISMS.adoc):
        #   1. `.hypatia-baseline.json` — array of acknowledged findings,
        #      shape mirrors the Hypatia findings themselves. Schema is
        #      `.machine_readable/hypatia-baseline.schema.json` in this
        #      repo, enforced structurally by apply-baseline.sh itself
        #      (jq mirror; a malformed baseline exits 2 instead of
        #      silently matching nothing). Added 2026-05-25 as part of
        #      the convergence on a single exemption mechanism.
        #   2. `.hypatia-ignore` flat-file — legacy single-rule-per-line
        #      format (`cicd_rules/banned_language_file:<relpath>`).
        #      Will be retired in a follow-up PR once .hypatia-baseline.json
        #      is in active use across the estate.
        #   3. Inline `# hypatia:ignore ...` pragma in the file's first
        #      8 lines — the same escape the Hypatia scanner itself
        #      honours.
        {
          name: "Check banned-language files (ReScript / Go / Python / Java / Kotlin / Groovy / Swift / Dart / V-lang / Makefile)",
          run: "rule_module=\"cicd_rules\"\nrule_type=\"banned_language_file\"\nrule=\"${rule_module}/${rule_type}\"\n\n# Baseline lookup: returns 0 (exempt) if the file appears in\n# .hypatia-baseline.json with a matching rule_module + type.\n# Honours both `file` (exact) and `file_pattern` (glob) entries.\n# The glob → regex translation mirrors apply-baseline.sh exactly:\n#   `**` matches any depth (incl. `/`); `*` matches one segment.\n# Pattern support unblocks language-demo repos (absolute-zero\n# carries ~30 banned-language example files under `examples/`)\n# and any repo that vendors such subtrees, replacing per-file\n# `.hypatia-ignore` enumeration with one `file_pattern` entry.\nin_baseline() {\n  local target=\"$1\"\n  [ -f .hypatia-baseline.json ] || return 1\n  command -v jq >/dev/null 2>&1 || return 1\n  # Note: the `as $pat` capture is essential — inside `test(...)`\n  # the dot rebinds to test's input ($f, a string), so\n  # `.file_pattern` would error with \"Cannot index string\". We\n  # capture file_pattern in $pat first, then reference it inside\n  # the test() argument.\n  jq -e \\\n    --arg rm \"$rule_module\" \\\n    --arg rt \"$rule_type\" \\\n    --arg f  \"$target\" \\\n    'any(.[];\n         .rule_module == $rm and .type == $rt\n         and (\n           (.file? // null) == $f\n           or (\n             (.file_pattern? // null) as $pat\n             | $pat != null\n             and ($f | test(\n               $pat\n               | gsub(\"\\\\*\\\\*\"; \"DOUBLESTAR\")\n               | gsub(\"\\\\*\"; \"[^/]*\")\n               | gsub(\"DOUBLESTAR\"; \".*\")\n               | \"^\" + . + \"$\"\n             ))\n           )\n         ))' \\\n    .hypatia-baseline.json >/dev/null 2>&1\n}\n\nis_exempt() {\n  f=\"${1#./}\"\n  if in_baseline \"$f\"; then\n    echo \"⏭️  exempt (baseline): $f\"\n    return 0\n  fi\n  if [ -f .hypatia-ignore ] && grep -qxF \"${rule}:${f}\" .hypatia-ignore; then\n    return 0\n  fi\n  if head -n 8 \"$1\" 2>/dev/null | grep -q \"hypatia:ignore.*${rule}\"; then\n    return 0\n  fi\n  return 1\n}\n\n# $1 = human label, $2 = remediation hint, $3 = newline-separated\n# candidate paths (possibly empty). Reads via here-string so this\n# runs in the current shell — no subshell, exit propagates.\nenforce() {\n  label=\"$1\"; hint=\"$2\"; candidates=\"$3\"; violations=\"\"\n  while IFS= read -r f; do\n    [ -z \"$f\" ] && continue\n    if is_exempt \"$f\"; then\n      echo \"⏭️  exempt (${rule}): $f\"\n      continue\n    fi\n    violations=\"${violations}${f}\n\"\n  done <<< \"$candidates\"\n  if [ -n \"$(printf '%s' \"$violations\" | tr -d '[:space:]')\" ]; then\n    echo \"❌ ${label} detected - ${hint}\"\n    printf '%s' \"$violations\"\n    echo \"   (declare an exemption via .hypatia-ignore or an inline\"\n    echo \"    '# hypatia:ignore ${rule}' pragma if intentional)\"\n    exit 1\n  fi\n  echo \"✅ No non-exempt ${label}\"\n}\n\n# Use `git ls-files` instead of `find` so only TRACKED files are\n# inspected. This respects .gitignore by definition — vendored\n# deps in deps/, node_modules/, _build/ etc. are never tracked\n# and cannot produce false-positives. Root cause for the switch:\n# developer-ecosystem@baab1534 had false-positive governance\n# failures because `find` crawled gitignored vendor directories.\n# `git ls-files` works correctly on fresh PR checkouts because\n# actions/checkout populates the index before running workflows.\nRES_FILES=$(git ls-files '*.res')\nGO_FILES=$(git ls-files '*.go')\nPY_FILES=$(git ls-files '*.py' \\\n  | grep -v venv | grep -v __pycache__ || [ $? -eq 1 ])\nMAKE_FILES=$(git ls-files 'Makefile' 'Makefile.*' '*.mk' \\\n  | grep -v '\\.github/' || [ $? -eq 1 ])\n# Platform-required JVM shims carve-out 2026-06-02:\n# Java is permitted only in Android source trees\n# (android/**/src/**/*.java) because Android instantiates\n# Service/BroadcastReceiver/AppWidgetProvider/Activity classes by\n# name at platform boundaries — Rust/Zig cannot provide JVM\n# bytecode for these. Each Android Java shim must be a minimal\n# delegating wrapper (typically <10 LoC) that JNIs into Rust/Zig\n# immediately.\n#\n# Kotlin/Groovy: NO JVM-interop exemption (reverted 2026-06-24).\n# Kotlin is goodbye. There is NO carve-out for hand-written JVM\n# bindings: FFI/interop to other ecosystems MUST be authored as\n# Idris2-ABI → Zig FFI/API (Idris2 → C only as an absolute last\n# resort if Zig genuinely cannot reach the boundary), never as\n# Kotlin/Java/Groovy `bindings/*`. Mobile uses Tauri/Dioxus. The\n# only remaining Java carve-out is the minimal Android platform\n# shim above. `.groovy` is detected so it is banned everywhere.\nJAVA_FILES=$(git ls-files '*.java' '*.kt' '*.kts' '*.groovy' \\\n  | grep -vE '(^|/)android/.*/src/.*\\.java$' || [ $? -eq 1 ])\nSWIFT_FILES=$(git ls-files '*.swift')\nDART_FILES=$(git ls-files '*.dart' 'pubspec.yaml')\n# V-lang detected by manifest (v.mod / vpkg.json); the .v extension\n# collides with Verilog so we never key on it.\nVMOD_FILES=$(git ls-files 'v.mod' 'vpkg.json')\n\nenforce \"ReScript files\" \"use AffineScript instead\" \"$RES_FILES\"\nenforce \"Go files\" \"use Rust/WASM instead\" \"$GO_FILES\"\nenforce \"Python files\" \"Python is fully banned — use AffineScript/Rust/SPARK/Julia (SaltStack carveout removed 2026-01-03)\" \"$PY_FILES\"\nenforce \"Makefiles\" \"use Mustfile/justfile instead\" \"$MAKE_FILES\"\nenforce \"Java/Kotlin/Groovy files\" \"Kotlin is goodbye — apps use Tauri/Dioxus; FFI/interop must be Idris2-ABI -> Zig FFI (or Idris2 -> C as a last resort), NOT hand-written JVM bindings\" \"$JAVA_FILES\"\nenforce \"Swift files\" \"use Tauri/Dioxus instead\" \"$SWIFT_FILES\"\nenforce \"Flutter/Dart files\" \"use Tauri/Dioxus instead (Google lock-in)\" \"$DART_FILES\"\nenforce \"V-lang manifests (v.mod / vpkg.json)\" \"V-lang is banned since 2026-04-10 — migrate to Zig\" \"$VMOD_FILES\"\n",
        },
        {
          name: "Check for npm/yarn artifacts",
          # standards#67 — npm-avoidant: package-lock.json must never be tracked
          # estate-wide. Check recursively (not just root) to catch monorepo
          # sub-packages. See 3-practice/LANGUAGE-POLICY.adoc §1 and docs/JS-RUNTIME-POLICY.adoc.
          #
          # 2026-08-07: this step previously failed any repository carrying
          # bun.lockb ("Use Deno instead") and any package.json declaring runtime
          # dependencies. 3-practice/LANGUAGE-POLICY.adoc §1 has made Bun the tier-1 runtime
          # since 2026-07-29, and Bun's model IS an npm-compatible package.json
          # plus bun.lock — so this gate made adopting the estate's first-choice
          # runtime impossible, not merely awkward. It blocked what the policy
          # mandates. Bun artifacts are now accepted; npm and yarn are unchanged.
          run: "LOCK_FILES=$(git ls-files 'package-lock.json' '**/package-lock.json' 2>/dev/null)\nYARN_FILES=$(find . -name \"yarn.lock\" -not -path \"./.git/*\" 2>/dev/null)\nNPMRC_FILES=$(find . -name \".npmrc\" -not -path \"./.git/*\" 2>/dev/null)\nBUN_LOCK=$(find . \\( -name \"bun.lock\" -o -name \"bun.lockb\" \\) -not -path \"./.git/*\" 2>/dev/null)\nFAILED=\"\"\nif [ -n \"$LOCK_FILES\" ]; then\n  echo \"❌ Tracked package-lock.json detected (standards#67 — npm-avoidant).\"\n  echo \"   npm is tier 4: permitted, never preferred. Prefer Bun (tier 1).\"\n  printf '%s\\n' \"$LOCK_FILES\"\n  FAILED=1\nfi\nif [ -n \"$YARN_FILES\" ]; then\n  echo \"❌ yarn.lock detected. yarn is not in the estate tier list.\"\n  echo \"   Use Bun (tier 1), or Deno / pnpm / npm in that order.\"\n  printf '%s\\n' \"$YARN_FILES\"\n  FAILED=1\nfi\nif [ -n \"$NPMRC_FILES\" ]; then\n  echo \"❌ .npmrc detected. Configure the runtime you actually use —\"\n  echo \"   bunfig.toml for Bun, deno.json for Deno.\"\n  printf '%s\\n' \"$NPMRC_FILES\"\n  FAILED=1\nfi\nif [ -n \"$BUN_LOCK\" ]; then\n  echo \"✅ Bun lockfile present — tier 1 (3-practice/LANGUAGE-POLICY.adoc §1).\"\nfi\n# Root package.json with runtime \"dependencies\". Bun consumes\n# package.json by design, so this is only an anti-pattern when the\n# repository is NOT using Bun; otherwise it is the tier-1 runtime\n# working exactly as intended.\nif [ -f package.json ] && grep -q '\"dependencies\"[[:space:]]*:[[:space:]]*{[^}]' package.json; then\n  if [ -n \"$BUN_LOCK\" ]; then\n    echo \"✅ package.json runtime dependencies accompanied by a Bun lockfile — tier 1, fine.\"\n  else\n    echo \"❌ package.json with runtime \\\"dependencies\\\" and no Bun lockfile.\"\n    echo \"   Adopt Bun (tier 1) or declare imports in deno.json (tier 2).\"\n    FAILED=1\n  fi\nfi\nif [ -n \"$FAILED\" ]; then\n  echo \"See hyperpolymath/standards docs/JS-RUNTIME-POLICY.adoc for remediation.\"\n  exit 1\nfi\necho \"✅ No npm/bun violations\"\n",
        },
        {
          name: "Check for tsconfig / rescript config",
          # Honours the same `.hypatia-ignore` exemption mechanism as the
          # banned-language-files step (standards#72, Explicit-Escape
          # Principle). A config file is exempt if either
          #   * `.hypatia-ignore` contains the exact line
          #     `cicd_rules/banned_config_file:<config>`, OR
          #   * the file carries an inline `# hypatia:ignore … banned_config_file`
          #     pragma in its first 8 lines (works for JSONC-style configs;
          #     not for strict JSON variants).
          # Required so repos that legitimately retain ReScript while in
          # mid-migration (per their `.claude/CLAUDE.md`, e.g. verisimdb)
          # can declare the exemption explicitly instead of being globally
          # blocked. Same pattern as the .res file step above.
          run: "rule=\"cicd_rules/banned_config_file\"\n\nis_exempt() {\n  f=\"$1\"\n  if [ -f .hypatia-ignore ] && grep -qxF \"${rule}:${f}\" .hypatia-ignore; then\n    return 0\n  fi\n  if head -n 8 \"$f\" 2>/dev/null | grep -q \"hypatia:ignore.*${rule}\"; then\n    return 0\n  fi\n  return 1\n}\n\ncheck_config() {\n  cfg=\"$1\"; hint=\"$2\"\n  if [ -f \"$cfg\" ]; then\n    if is_exempt \"$cfg\"; then\n      echo \"⏭️  exempt (${rule}): $cfg\"\n      return 0\n    fi\n    echo \"❌ ${cfg} detected - ${hint}\"\n    echo \"   (declare an exemption via .hypatia-ignore line\"\n    echo \"    '${rule}:${cfg}' if intentional)\"\n    exit 1\n  fi\n}\n\ncheck_config \"tsconfig.json\" \"use AffineScript instead\"\ncheck_config \"rescript.json\" \"use AffineScript config instead\"\ncheck_config \"bsconfig.json\" \"use AffineScript config instead\"\necho \"✅ No non-exempt tsconfig.json / rescript config\"\n",
        },
        {
          name: "Summary",
          run: "echo \"RSR language/package policy passed — allowed: AffineScript, Deno,\"\necho \"WASM, Rust, OCaml, Haskell, Guile/Scheme.\"\n",
        },
      ],
    },
    package-policy: {
      name: "Guix packaging policy (Nix retired)",
      runs-on: "${{ inputs.runs-on }}",
      timeout-minutes: 10,
      permissions: {
        contents: "read",
      },
      steps: [
        {
          uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1", # v7.0.1
          with: {
            repository: "${{ github.repository }}",
            # Pin to the concrete event SHA (the PR merge commit on
            # pull_request, the pushed commit on push). Do NOT use
            # `ref: ${{ github.ref }}`: in a reusable workflow called from a
            # pull_request, github.ref is the named merge ref
            # `refs/pull/<n>/merge`, which actions/checkout cannot fetch
            # ("couldn't find remote ref refs/pull/<n>/merge") — it broke 8/10
            # governance jobs on every PR estate-wide. github.sha resolves to the
            # same merge commit but is always fetchable.
            ref: "${{ github.sha }}",
          },
        },
        # A reusable workflow only auto-checks-out its own YAML, not sibling
        # scripts. Sparse-check-out standards' scripts/ to get
        # check-package-policy.sh, mirroring the baseline-filter job above.
        {
          name: "Check out standards for the package-policy gate",
          uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1", # v7.0.1
          with: {
            repository: "hyperpolymath/standards",
            ref: "${{ job.workflow_sha }}",
            path: ".standards-checkout",
            sparse-checkout: "scripts\n.machine_readable/template-capability-gates.toml\n",
            sparse-checkout-cone-mode: false,
          },
        },
        {
          name: "Enforce Guix-only packaging policy",
          run: "# Move the checker OUT of the scanned tree and delete the standards\n# checkout before scanning: the gate walks the whole caller tree, so\n# a packaging file shipped inside .standards-checkout/ would satisfy\n# the policy on the caller's behalf (same trap as the baseline job).\n# The capability resolver (check-rsr-profile.sh) and its gate table travel\n# with the checker, in the same relative layout, so applicability is read\n# from the same standards commit as the policy itself.\npkg=\"$RUNNER_TEMP/pkg-policy\"\nmkdir -p \"$pkg/scripts\" \"$pkg/.machine_readable\"\ncp .standards-checkout/scripts/check-package-policy.sh .standards-checkout/scripts/check-rsr-profile.sh \"$pkg/scripts/\"\ncp .standards-checkout/.machine_readable/template-capability-gates.toml \"$pkg/.machine_readable/\"\nrm -rf .standards-checkout\nbash \"$pkg/scripts/check-package-policy.sh\" .\n",
        },
      ],
    },
    security-policy: {
      name: "Security policy checks",
      runs-on: "${{ inputs.runs-on }}",
      timeout-minutes: 10,
      permissions: {
        contents: "read",
      },
      steps: [
        {
          uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1", # v7.0.1
          with: {
            repository: "${{ github.repository }}",
            # Pin to the concrete event SHA (the PR merge commit on
            # pull_request, the pushed commit on push). Do NOT use
            # `ref: ${{ github.ref }}`: in a reusable workflow called from a
            # pull_request, github.ref is the named merge ref
            # `refs/pull/<n>/merge`, which actions/checkout cannot fetch
            # ("couldn't find remote ref refs/pull/<n>/merge") — it broke 8/10
            # governance jobs on every PR estate-wide. github.sha resolves to the
            # same merge commit but is always fetchable.
            ref: "${{ github.sha }}",
          },
        },
        {
          name: "Security checks",
          run: "FAILED=false\nWEAK_CRYPTO=$(grep -rE 'md5\\(|sha1\\(' --include=\"*.py\" --include=\"*.rb\" --include=\"*.js\" --include=\"*.ts\" --include=\"*.go\" --include=\"*.rs\" . 2>/dev/null | grep -v 'checksum\\|cache\\|test\\|spec' | head -5)\nif [ -n \"$WEAK_CRYPTO\" ]; then\n  echo \"⚠️ Weak crypto (MD5/SHA1) detected. Use SHA256+ for security:\"\n  echo \"$WEAK_CRYPTO\"\nfi\nHTTP_URLS=$(grep -rE 'http://[^l][^o][^c]' --include=\"*.py\" --include=\"*.js\" --include=\"*.ts\" --include=\"*.go\" --include=\"*.rs\" --include=\"*.yaml\" --include=\"*.yml\" . 2>/dev/null | grep -v 'localhost\\|127.0.0.1\\|example\\|test\\|spec' | head -5)\nif [ -n \"$HTTP_URLS\" ]; then\n  echo \"⚠️ HTTP URLs found. Use HTTPS:\"\n  echo \"$HTTP_URLS\"\nfi\nSECRETS=$(grep -rEi '(api_key|apikey|secret_key|password)\\s*[=:]\\s*[\"\\x27][A-Za-z0-9+/=]{20,}' --include=\"*.py\" --include=\"*.js\" --include=\"*.ts\" --include=\"*.go\" --include=\"*.rs\" --include=\"*.env\" . 2>/dev/null | grep -v 'example\\|sample\\|test\\|mock\\|placeholder' | head -3)\nif [ -n \"$SECRETS\" ]; then\n  echo \"❌ Potential hardcoded secrets detected!\"\n  FAILED=true\nfi\nif [ \"$FAILED\" = true ]; then\n  exit 1\nfi\necho \"✅ Security policy check passed\"\n",
        },
        {
          name: "SSH-remote policy (token-in-URL detection)",
          # Estate Remote-URL policy (standards#69 / 3-practice/REMOTE-URL-POLICY.adoc).
          # Scans every .git/config present in the checkout tree for token-in-URL
          # remotes. Fails hard so a compromised credential cannot silently reach
          # a PR or main-branch push.
          run: "found=0\nwhile IFS= read -r cfg; do\n  if grep -qE \"url[[:space:]]*=[[:space:]]*https://[^[:space:]]*(x-access-token:|:gho_|:ghp_|:ghs_|:github_pat_)\" \"$cfg\" 2>/dev/null; then\n    echo \"❌ token-in-URL remote detected in: $cfg\"\n    grep -E \"url[[:space:]]*=\" \"$cfg\" \\\n      | sed 's/\\(x-access-token:\\|gho_\\|ghp_\\|ghs_\\|github_pat_\\)[^@]*/\\1****/g'\n    found=$((found + 1))\n  fi\ndone < <(find . -name \"config\" -path \"*/.git/config\" 2>/dev/null)\nif [ \"$found\" -gt 0 ]; then\n  echo \"\"\n  echo \"Remediation: git remote set-url <name> git@github.com:<org>/<repo>.git\"\n  echo \"Policy: 3-practice/REMOTE-URL-POLICY.adoc — SSH-only remotes; no PAT/token in URL ever.\"\n  exit 1\nfi\necho \"✅ SSH-remote policy: no token-in-URL remotes detected\"\n",
        },
        {
          name: "Tooling version integrity",
          # Estate Tooling Version Integrity policy (root cause: burble#39).
          # Inline + dependency-free so it runs in any caller repo.
          # R0 just>=1.19.0 floor (blocking when just present) and R1
          # unversioned family-tool install (blocking) are hard; R4
          # unexplained continue-on-error is advisory-first per the
          # documented "advisory now, --strict later" gating doctrine.
          run: "set -uo pipefail\nFAMILY='just|must|trust|adjust|bust|dust|intend'\nif command -v just >/dev/null 2>&1; then\n  jv=$(just --version 2>/dev/null | cut -d' ' -f2)\n  maj=${jv%%.*}; rest=${jv#*.}; min=${rest%%.*}\n  if [ -z \"$jv\" ] || ! { [ \"${maj:-0}\" -gt 1 ] || { [ \"${maj:-0}\" -eq 1 ] && [ \"${min:-0}\" -ge 19 ]; }; }; then\n    echo \"❌ [R0] just ${jv:-?} < 1.19.0 — import? unsupported\"; exit 1\n  fi\n  echo \"✅ [R0] just $jv >= 1.19.0\"\nelse\n  echo \"ℹ️  [R0] just not on PATH — skipped\"\nfi\nR1=0\nif [ -d .github/workflows ]; then\n  while IFS= read -r hit; do\n    [ -n \"$hit\" ] || continue\n    echo \"❌ [R1] unversioned family-tool install: $hit\"\n    R1=$((R1+1))\n  done < <(grep -rnE \"^[[:space:]]*tool:[[:space:]]*(${FAMILY})[[:space:]]*$\" .github/workflows 2>/dev/null || true)\nfi\n[ \"$R1\" -gt 0 ] && { echo \"❌ [R1] $R1 unversioned family-tool install(s) — pin tool: <name>@<ver>\"; exit 1; }\necho \"✅ Tooling version integrity passed (R1 clean; R4 advisory via standards/tasks/tooling-integrity-lint.sh)\"\n",
        },
        {
          name: "Documentation version-string drift (R5b)",
          # Estate canonical-reference drift policy. Forbids pinned
          # `Version: x.y.z` strings in load-bearing top-level docs
          # because they reliably go stale and disagree with each other
          # (echidna had v1.5.0 in README.adoc, v2.3.0 in CLAUDE.md,
          # v2.1.0 in Cargo.toml simultaneously — cleared by echidna#169
          # / #170 / #171). CHANGELOG.md is the canonical release-history
          # surface; Cargo.toml's [package].version is the canonical
          # semver pin; the git log carries dates. Duplicating either
          # in human prose invites drift.
          #
          # Scope: repo-root *.md + *.adoc only. Sub-tree historical
          # docs (docs/handover/, docs/decisions/, docs/releases/,
          # audit reports) are owner-managed snapshots and not in
          # scope. CHANGELOG.{md,adoc} explicitly skipped.
          #
          # Companion rule R5a (bare prover counts) is repo-local where
          # the count semantics are domain-specific — see
          # `echidna/.github/workflows/governance-doc-drift.yml`.
          run: "set -uo pipefail\nPATTERN='^[[:space:]]*[*_]{0,2}Version[*_]{0,2}[[:space:]]*[:=][[:space:]]*v?[0-9]+\\.[0-9]+\\.[0-9]+'\nR5B=0\nshopt -s nullglob\nfor doc in *.md *.adoc; do\n  [ -f \"$doc\" ] || continue\n  case \"$doc\" in CHANGELOG.md|CHANGELOG.adoc) continue ;; esac\n  while IFS= read -r hit; do\n    [ -n \"$hit\" ] || continue\n    echo \"❌ [R5b] pinned version string: $doc:$hit\"\n    R5B=$((R5B+1))\n  done < <(grep -nE \"$PATTERN\" \"$doc\" 2>/dev/null || true)\ndone\nif [ \"$R5B\" -gt 0 ]; then\n  echo \"\"\n  echo \"❌ [R5b] $R5B pinned version-string line(s) in load-bearing docs.\"\n  echo \"Fix: drop the embedded version; defer to CHANGELOG.md (release\"\n  echo \"history) and Cargo.toml's [package].version (semver pin) or the\"\n  echo \"equivalent package manifest. Git log carries dates.\"\n  exit 1\nfi\necho \"✅ [R5b] Documentation version-string drift: clean.\"\n",
        },
        {
          name: "Canonical-reference drift (R5 generic)",
          # Repo-local canonical-reference rules. Reads
          # `.github/canonical-references/*.{yml,yaml}` in the calling
          # repo; each file declares one drift pattern with its
          # canonical pointer. Skipped silently when the directory is
          # absent — repos opt in by creating it.
          #
          # Generalises echidna's R5a (bare prover counts → docs/PROVER_COUNT.md)
          # so sibling repos with their own canonical-reference cohorts
          # (lemma counts for proven, stdlib fn counts for affinescript,
          # proof-obligation counts for typed-wasm, rule counts for
          # ephapax, …) can declare their drift patterns without
          # carrying a per-repo workflow.
          #
          # Rule file shape:
          #   id: short-slug
          #   description: one-line summary
          #   patterns: [POSIX-ERE strings]
          #   canonical_pointer: path/to/single-source-of-truth.md
          #   scope:
          #     include: [list, of, files, to, scan]
          #
          # Patterns are POSIX-ERE (run through `grep -E`). Each
          # listed include path is scanned line-by-line; a match emits
          # a `::error::` annotation and the job fails non-zero.
          # CHANGELOG.{md,adoc} and the rule files themselves are
          # excluded automatically; the rule's own `canonical_pointer`
          # is also excluded so the canonical doc can name what it
          # is the canonical answer for.
          run: "set -uo pipefail\nDIR=.github/canonical-references\nif [ ! -d \"$DIR\" ]; then\n  echo \"ℹ️  [R5] no $DIR/ — skipped (repo has not opted in)\"\n  exit 0\nfi\n# Rule files are read with yq, never a hand parser (YAML-POLICY Y-1); this\n# gate previously parsed them with Python, which the estate bans.\nif ! command -v yq >/dev/null 2>&1 || ! command -v jq >/dev/null 2>&1; then\n  echo \"❌ [R5] yq and jq are required on the runner for YAML rule parsing\"\n  exit 2\nfi\nmapfile -t files < <(find \"$DIR\" -maxdepth 1 -type f \\( -name '*.yml' -o -name '*.yaml' \\) ! -name '.*' | LC_ALL=C sort)\nif [ \"${#files[@]}\" -eq 0 ]; then\n  echo \"ℹ️  [R5] $DIR/ has no .yml/.yaml rules — skipped\"\n  exit 0\nfi\n\nerr=$(mktemp)\ntrap 'rm -f \"$err\"' EXIT\ntotal=0\nfor rf in \"${files[@]}\"; do\n  if ! cfg=$(yq -o json '.' \"$rf\" 2>&1); then\n    echo \"❌ [R5] $rf: not parseable YAML: $cfg\"; total=$((total + 1)); continue\n  fi\n  if [ \"$(jq -r 'type' <<<\"$cfg\")\" != object ]; then\n    echo \"❌ [R5] $rf: top-level must be a mapping\"; total=$((total + 1)); continue\n  fi\n  rid=$(jq -r --arg b \"$(basename \"$rf\")\" 'if has(\"id\") then .id | tostring else $b end' <<<\"$cfg\")\n  desc=$(jq -r '.description // \"\"' <<<\"$cfg\")\n  canon=$(jq -r '.canonical_pointer // \"\"' <<<\"$cfg\")\n  mapfile -t pats < <(jq -r '(.patterns // [])[]' <<<\"$cfg\")\n  mapfile -t includes < <(jq -r '((.scope // {}).include // [])[]' <<<\"$cfg\")\n  if [ \"${#pats[@]}\" -eq 0 ] || [ \"${#includes[@]}\" -eq 0 ]; then\n    echo \"❌ [R5:$rid] missing patterns or scope.include in $rf\"\n    total=$((total + 1)); continue\n  fi\n  rule_hits=0\n  for f_ in \"${includes[@]}\"; do\n    # Self-references are excluded: the changelogs, the rule file, and the\n    # rule's own canonical pointer.\n    case \"$f_\" in CHANGELOG.md|CHANGELOG.adoc|\"$rf\") continue ;; esac\n    if [ -n \"$canon\" ] && [ \"$f_\" = \"$canon\" ]; then continue; fi\n    [ -f \"$f_\" ] || continue\n    for pat in \"${pats[@]}\"; do\n      out=$(grep -nE -e \"$pat\" -- \"$f_\" 2>\"$err\"); rc=$?\n      if [ \"$rc\" -eq 0 ]; then\n        while IFS= read -r line; do\n          echo \"::error file=$f_,line=${line%%:*}::[R5:$rid] ${line#*:}  →  route to ${canon:-drop or move to a canonical source}\"\n          rule_hits=$((rule_hits + 1))\n        done <<<\"$out\"\n      elif [ \"$rc\" -gt 1 ]; then\n        echo \"❌ [R5:$rid] grep error on $f_: $(<\"$err\")\"\n        rule_hits=$((rule_hits + 1))\n      fi\n    done\n  done\n  if [ \"$rule_hits\" -gt 0 ]; then\n    echo \"❌ [R5:$rid] $rule_hits hit(s). $desc\"\n  fi\n  total=$((total + rule_hits))\ndone\n\nif [ \"$total\" -gt 0 ]; then\n  echo\n  echo \"❌ [R5] $total canonical-reference drift hit(s) across ${#files[@]} rule(s).\"\n  exit 1\nfi\necho \"✅ [R5] canonical-reference drift: clean across ${#files[@]} rule(s).\"\n",
        },
      ],
    },
    quality: {
      name: "Code quality + docs",
      runs-on: "${{ inputs.runs-on }}",
      timeout-minutes: 10,
      permissions: {
        contents: "read",
      },
      steps: [
        {
          uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1", # v7.0.1
          with: {
            repository: "${{ github.repository }}",
            # Pin to the concrete event SHA (the PR merge commit on
            # pull_request, the pushed commit on push). Do NOT use
            # `ref: ${{ github.ref }}`: in a reusable workflow called from a
            # pull_request, github.ref is the named merge ref
            # `refs/pull/<n>/merge`, which actions/checkout cannot fetch
            # ("couldn't find remote ref refs/pull/<n>/merge") — it broke 8/10
            # governance jobs on every PR estate-wide. github.sha resolves to the
            # same merge commit but is always fetchable.
            ref: "${{ github.sha }}",
          },
        },
        {
          name: "Check file permissions",
          # advisory: informational only; repos can opt into blocking locally.
          # No continue-on-error needed: the step below always exits 0 itself;
          # it now surfaces its finding as an explicit ::warning:: instead of a
          # silent printout.
          run: "FOUND=$(find . -type f -perm /111 -name \"*.sh\" | head -20)\nif [ -n \"$FOUND\" ]; then\n  echo \"::warning::Executable .sh files found (informational only):\"\n  echo \"$FOUND\"\nelse\n  echo \"No executable .sh files found.\"\nfi\n",
        },
        {
          name: "Check TODO/FIXME",
          # advisory: informational only; repos can opt into blocking locally.
          run: "FOUND=$(grep -rn \"TODO\\|FIXME\\|HACK\\|XXX\" --include=\"*.rs\" --include=\"*.res\" --include=\"*.py\" --include=\"*.ex\" . | head -20)\nif [ -n \"$FOUND\" ]; then\n  echo \"::warning::TODO/FIXME/HACK/XXX markers found (informational only):\"\n  echo \"$FOUND\"\nelse\n  echo \"No TODO/FIXME/HACK/XXX markers found.\"\nfi\n",
        },
        {
          name: "Check for large files",
          # advisory: informational only; repos can opt into blocking locally.
          run: "FOUND=$(find . -type f -size +1M -not -path \"./.git/*\" | head -20)\nif [ -n \"$FOUND\" ]; then\n  echo \"::warning::Files larger than 1M found (informational only):\"\n  echo \"$FOUND\"\nelse\n  echo \"No files larger than 1M found.\"\nfi\n",
        },
        {
          name: "EditorConfig check",
          id: "editorconfig_check",
          uses: "editorconfig-checker/action-editorconfig-checker@51f63319f592f97930c73d9c46184d20bd206393", # v3.0.0
          # advisory-by-design, fails OPEN not closed: formatting hygiene is
          # reported from the reusable estate bundle; the follow-up step below
          # emits ::warning:: explicitly when this fails instead of silently
          # swallowing it. Repos opt into blocking formatter checks locally.
          # hypatia: allow research_extensions/RE005 -- advisory-by-design, fails OPEN; see comment above.
          continue-on-error: true,
        },
        {
          name: "EditorConfig check - surface result",
          if: "steps.editorconfig_check.outcome == 'failure'",
          run: "echo \"::warning::EditorConfig check found formatting issues (advisory only — see the 'EditorConfig check' step's own log above; repos opt into blocking locally when ready).\"",
        },
        # Sparse-check-out standards' scripts/ for the docs gate (a reusable
        # workflow only auto-checks-out its own YAML, not sibling scripts).
        {
          name: "Check out standards for the docs gate",
          uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1", # v7.0.1
          with: {
            repository: "hyperpolymath/standards",
            ref: "${{ job.workflow_sha }}",
            path: ".standards-checkout",
            sparse-checkout: "scripts\n",
            sparse-checkout-cone-mode: false,
          },
        },
        {
          name: "Check documentation",
          run: "# Split gate (standards#505): README + LICENSE block immediately —\n# measured 0/412 callers missing either, so arming them reds nobody.\n# CONTRIBUTING (54/412 missing) warns until the cutoff baked into the\n# script, then blocks. See scripts/check-docs-presence.sh.\ncp .standards-checkout/scripts/check-docs-presence.sh \"$RUNNER_TEMP/\"\n# The launcher-standard currency gate (standards#960 AC4) is copied\n# out here too, because this step deletes the checkout. Prefer the\n# CALLER's own copy when present (self-lint: standards validating\n# itself must run the tree under test, not main's copy -- a gate fix\n# in flight would otherwise be judged by the version it replaces).\n# Callers without the script keep the main-pinned fallback.\nif [ -f scripts/check-launcher-standard-currency.sh ]; then\n  cp scripts/check-launcher-standard-currency.sh \"$RUNNER_TEMP/\"\nelse\n  cp .standards-checkout/scripts/check-launcher-standard-currency.sh \"$RUNNER_TEMP/\"\nfi\nrm -rf .standards-checkout\nbash \"$RUNNER_TEMP/check-docs-presence.sh\" .\n",
        },
        {
          name: "Check launcher-standard currency",
          run: "set -eo pipefail\n# Arming policy, and the evidence it rests on: standards#991.\n#\n#   retired-filename -> BLOCKS. A STABLE predicate:\n#   the retired `.a2ml` spelling of the launcher standard was\n#   deleted upstream on 2026-09-22\n#   (standards#952) and stays deleted, so a caller that is clean\n#   today cannot become defective without editing the citation\n#   itself. Measured 2026-09-22 over EVERY clone in the estate --\n#   595 scanned, 553 carrying an origin/main. 432 reference this\n#   reusable workflow, but only 12 do so at a MUTABLE ref (@main),\n#   and a new step reaches ONLY those 12: a caller pinned at a SHA\n#   freezes this whole file, this step included, so it can never\n#   receive the step at all. The real gate was run against all 12:\n#   12/12 rc=0, retired=0. Five slugs do carry the retired literal\n#   (tma-mark2, canonical-ums, the-nash-equilibrium,\n#   launch-scaffolder, trigger) and their overlap with the armed 12\n#   is ZERO -- so arming this tier reds ZERO live callers. A\n#   known-answer positive control fired (rc=1) on three of those\n#   defective repos through the identical harness, so the twelve\n#   zeros are a real measurement and not a broken probe.\n#\n#   stale-version -> WARNS, and does not block. A TIME-DEPENDENT\n#   predicate: the gate compares against its own CURRENT_VERSION, so\n#   every correctly-citing caller flips to defect the moment the\n#   standard bumps, having done nothing. A baked-in cutoff DATE does\n#   not cure that -- the #505 split above can use one because its\n#   missing-CONTRIBUTING population is static, while this population\n#   is regenerated at every bump. Each CURRENT_VERSION bump is a\n#   measure-then-arm event, not a date.\n#\n# Deliberately no --standard / --expect-version: the gate arrives\n# from the standard's own tree, so its CURRENT_VERSION is current by\n# construction. Pointing it at a caller's vendored copy of the deed\n# would red that caller for citing an older canon.\nrc=0\nbash \"$RUNNER_TEMP/check-launcher-standard-currency.sh\" --root . \\\n  >\"$RUNNER_TEMP/launcher-currency.out\" 2>&1 || rc=$?\ncat \"$RUNNER_TEMP/launcher-currency.out\"\n\n# rc=2 is a usage error OR a seeded self-test mutant that survived. A broken\n# invocation must never read as a clean pass, so it fails before the tier split.\nif [ \"$rc\" -eq 2 ]; then\n  echo \"::error::check-launcher-standard-currency exited 2: usage error, or a seeded self-test mutant survived. A broken invocation is a failure, not a pass.\"\n  exit 1\nfi\n\n# The tiers are split on the gate's own typed stdout lines, not on its exit\n# code -- rc=1 means \"some defect\", and the two classes are armed differently.\nretired=0\nif grep -q '^DEFECT retired-filename' \"$RUNNER_TEMP/launcher-currency.out\"; then retired=1; fi\nstale=0\nif grep -q '^DEFECT stale-version' \"$RUNNER_TEMP/launcher-currency.out\"; then stale=1; fi\n\nif [ \"$retired\" -eq 1 ]; then\n  # ⚠ Do NOT name the retired filename literally here. This workflow\n  # is part of the caller's scanned tree, so the gate reads its own\n  # error message and reports it as a defect -- measured: two\n  # defects on this file, from a comment and from this very echo.\n  # Nothing is lost by staying general: the gate has already printed\n  # both the offending file:line and its own cure text above.\n  echo \"::error::This repository names the retired .a2ml spelling of the launcher standard, deleted upstream on 2026-09-22 (standards#952). The offending file:line and the cure are printed above.\"\n  exit 1\nfi\n\nif [ \"$stale\" -eq 1 ]; then\n  echo \"::warning::This repository cites a launcher-standard version that is no longer current. NOT blocking, by policy (standards#991): the expected version moves with the standard, so a correct citation goes stale with no action of yours. Refresh it when convenient.\"\nfi\n\n# Any other non-zero rc is the gate failing in a way this wrapper does not\n# classify; fail rather than guess.\nif [ \"$rc\" -ne 0 ] && [ \"$retired\" -eq 0 ] && [ \"$stale\" -eq 0 ]; then\n  echo \"::error::check-launcher-standard-currency exited $rc but emitted no recognised DEFECT line. Failing closed.\"\n  exit 1\nfi\n",
        },
      ],
    },
    wellknown: {
      name: "Well-Known (RFC 9116 + RSR)",
      runs-on: "${{ inputs.runs-on }}",
      timeout-minutes: 10,
      permissions: {
        contents: "read",
      },
      steps: [
        {
