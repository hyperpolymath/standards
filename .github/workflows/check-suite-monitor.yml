# SPDX-License-Identifier: MPL-2.0
# 🟡 CHECK: Check Suite Monitor
# This workflow is managed by gh actions-lock.
#
# Monitors the status of all check suites in the repository to ensure
# CI health and catch misconfigurations early.
name: "🟡 CHECK: Check Suite Monitor"

on:
  check_suite:
    types: [completed, requested, rerequested]
  workflow_run:
    workflows: ["🔴 GATE: *", "🟡 CHECK: *"]
    types: [completed]

permissions:
  contents: read
  checks: read
  pull-requests: read
  actions: read

jobs:
  monitor-check-suite:
    name: Monitor Check Suite Completion
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Get Check Suite Details
        id: check-suite
        run: |
          echo "🔍 Retrieving check suite information..."
          
          # Get the check suite that triggered this workflow
          CHECK_SUITE_ID="${{ github.event.check_suite.id }}"
          REPO="${{ github.repository }}"
          
          if [ -n "$CHECK_SUITE_ID" ]; then
            echo "check_suite_id=$CHECK_SUITE_ID" >> $GITHUB_OUTPUT
            
            # Get check suite details via GitHub API
            # Note: This would require a token with appropriate permissions
            # For now, we'll use the context information
            
            echo "repository=$REPO" >> $GITHUB_OUTPUT
            echo "event_type=${{ github.event.action }}" >> $GITHUB_OUTPUT
            
            # Extract branch information
            if [ "${{ github.event.check_suite.pull_requests[0].id }}" != "" ]; then
              echo "is_pr=true" >> $GITHUB_OUTPUT
              echo "pr_number=${{ github.event.check_suite.pull_requests[0].number }}" >> $GITHUB_OUTPUT
            else
              echo "is_pr=false" >> $GITHUB_OUTPUT
            fi
            
            echo "head_sha=${{ github.event.check_suite.head_sha }}" >> $GITHUB_OUTPUT
            echo "conclusion=${{ github.event.check_suite.conclusion }}" >> $GITHUB_OUTPUT
          else
            echo "check_suite_id=unknown" >> $GITHUB_OUTPUT
          fi

      - name: Analyze Check Suite Results
        id: analyze
        run: |
          echo "🔍 Analyzing check suite results..."
          
          CONCLUSION="${{ steps.check-suite.outputs.conclusion }}"
          IS_PR="${{ steps.check-suite.outputs.is_pr }}"
          REPO="${{ steps.check-suite.outputs.repository }}"
          
          case "$CONCLUSION" in
            "success")
              echo "status=✅ PASSED" >> $GITHUB_OUTPUT
              echo "severity=none" >> $GITHUB_OUTPUT
              ;;
            "failure")
              echo "status=❌ FAILED" >> $GITHUB_OUTPUT
              echo "severity=high" >> $GITHUB_OUTPUT
              ;;
            "neutral")
              echo "status=⚪ NEUTRAL" >> $GITHUB_OUTPUT
              echo "severity=low" >> $GITHUB_OUTPUT
              ;;
            "cancelled"|"timed_out")
              echo "status=⏹️  ${CONCLUSION^^}" >> $GITHUB_OUTPUT
              echo "severity=medium" >> $GITHUB_OUTPUT
              ;;
            *)
              echo "status=❓ $CONCLUSION" >> $GITHUB_OUTPUT
              echo "severity=unknown" >> $GITHUB_OUTPUT
              ;;
          esac

      - name: Check Required GATE Workflows
        if: steps.check-suite.outputs.is_pr == 'true'
        id: gate-check
        run: |
          echo "🔍 Checking required 🔴 GATE workflows..."
          
          # List of required GATE workflows
          REQUIRED_GATES=(
            "🔴 GATE: Governance"
            "🔴 GATE: CodeQL"
            "🔴 GATE: Scorecard"
            "🔴 GATE: Hypatia Scan"
            "🔴 GATE: Secret Scanner"
            "🔴 GATE: Main Estate Audit"
          )
          
          # Get all check runs for this check suite
          # Note: This is a simplified version - in practice you'd need the GitHub API
          
          # For now, we'll just document what should be checked
          echo "required_gates=${#REQUIRED_GATES[@]}" >> $GITHUB_OUTPUT
          echo "gate_list=${REQUIRED_GATES[*]}" >> $GITHUB_OUTPUT
          
          # In a real implementation, this would query the GitHub API
          # to get all check runs and verify the required ones passed
          echo "::notice::This check verifies that all required 🔴 GATE workflows complete successfully"

      - name: Alert on Critical Failures
        if: steps.analyze.outputs.severity == 'high'
        uses: actions/github-script@v7
        with:
          script: |
            const checkSuiteId = '${{ steps.check-suite.outputs.check_suite_id }}';
            const conclusion = '${{ steps.check-suite.outputs.conclusion }}';
            const repo = context.repo;
            
            console.log(`Check suite ${checkSuiteId} ${conclusion.toUpperCase()}`);
            
            // This would create an issue or send a notification
            // For now, we'll just log it
            core.notice(`Check suite failed: ${checkSuiteId}`);

      - name: Log Check Suite Information
        run: |
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Check Suite Monitor Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Repository:** ${{ steps.check-suite.outputs.repository }}" >> $GITHUB_STEP_SUMMARY
          echo "**Check Suite ID:** ${{ steps.check-suite.outputs.check_suite_id }}" >> $GITHUB_STEP_SUMMARY
          echo "**Event Type:** ${{ steps.check-suite.outputs.event_type }}" >> $GITHUB_STEP_SUMMARY
          echo "**Head SHA:** ${{ steps.check-suite.outputs.head_sha }}" >> $GITHUB_STEP_SUMMARY
          echo "**Conclusion:** ${{ steps.check-suite.outputs.conclusion }}" >> $GITHUB_STEP_SUMMARY
          echo "**Status:** ${{ steps.analyze.outputs.status }}" >> $GITHUB_STEP_SUMMARY
          echo "**Severity:** ${{ steps.analyze.outputs.severity }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ "${{ steps.check-suite.outputs.is_pr }}" = "true" ]; then
            echo "**Pull Request:** #${{ steps.check-suite.outputs.pr_number }}" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**Required GATE Workflows:**" >> $GITHUB_STEP_SUMMARY
            echo "${{ steps.gate-check.outputs.gate_list }}" >> $GITHUB_STEP_SUMMARY
          fi

  workflow-run-monitor:
    name: Monitor Workflow Runs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'workflow_run'

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Get Workflow Run Information
        id: workflow-info
        run: |
          echo "workflow_name=${{ github.event.workflow }}" >> $GITHUB_OUTPUT
          echo "workflow_id=${{ github.event.workflow_run.id }}" >> $GITHUB_OUTPUT
          echo "conclusion=${{ github.event.workflow_run.conclusion }}" >> $GITHUB_OUTPUT
          echo "run_number=${{ github.event.workflow_run.run_number }}" >> $GITHUB_OUTPUT
          echo "head_sha=${{ github.event.workflow_run.head_sha }}" >> $GITHUB_OUTPUT

      - name: Analyze GATE Workflow Results
        if: contains(github.event.workflow, '🔴 GATE:')
        run: |
          CONCLUSION="${{ steps.workflow-info.outputs.conclusion }}"
          WORKFLOW="${{ steps.workflow-info.outputs.workflow_name }}"
          
          echo "🔍 Analyzing $WORKFLOW result: $CONCLUSION"
          
          case "$CONCLUSION" in
            "success")
              echo "::notice::✅ GATE workflow PASSED: $WORKFLOW"
              ;;
            "failure")
              echo "::error::❌ GATE workflow FAILED: $WORKFLOW"
              echo "This is a blocking failure - the PR cannot be merged"
              ;;
            "cancelled"|"timed_out")
              echo "::warning::⏹️  GATE workflow $CONCLUSION: $WORKFLOW"
              echo "This needs attention"
              ;;
            *)
              echo "::notice::❓ GATE workflow $CONCLUSION: $WORKFLOW"
              ;;
          esac

      - name: Track CI Health Metrics
        run: |
          echo "📊 Tracking CI health metrics..."
          
          # This would collect and store metrics about CI performance
          # For now, we'll just document the pattern
          
          echo "## CI Health Metrics" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Workflow:** ${{ steps.workflow-info.outputs.workflow_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Run Number:** ${{ steps.workflow-info.outputs.run_number }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Conclusion:** ${{ steps.workflow-info.outputs.conclusion }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Head SHA:** ${{ steps.workflow-info.outputs.head_sha }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "In a full implementation, this would track:" >> $GITHUB_STEP_SUMMARY
          echo "- Average workflow duration" >> $GITHUB_STEP_SUMMARY
          echo "- Failure rates by workflow" >> $GITHUB_STEP_SUMMARY
          echo "- Flaky workflow detection" >> $GITHUB_STEP_SUMMARY

  summary:
    name: Check Suite Monitor Summary
    runs-on: ubuntu-latest
    needs: [monitor-check-suite, workflow-run-monitor]
    if: always()

    steps:
      - name: Generate Summary
        run: |
          echo "## Check Suite Monitor - Final Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          echo "### Check Suite Monitoring" >> $GITHUB_STEP_SUMMARY
          if [ "${{ needs.monitor-check-suite.result }}" = "success" ]; then
            echo "✅ Check suite monitoring: **PASSED**" >> $GITHUB_STEP_SUMMARY
          elif [ "${{ needs.monitor-check-suite.result }}" = "failure" ]; then
            echo "❌ Check suite monitoring: **FAILED**" >> $GITHUB_STEP_SUMMARY
          else
            echo "⚪ Check suite monitoring: **SKIPPED**" >> $GITHUB_STEP_SUMMARY
          fi
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Workflow Run Monitoring" >> $GITHUB_STEP_SUMMARY
          if [ "${{ needs.workflow-run-monitor.result }}" = "success" ]; then
            echo "✅ Workflow run monitoring: **PASSED**" >> $GITHUB_STEP_SUMMARY
          elif [ "${{ needs.workflow-run-monitor.result }}" = "failure" ]; then
            echo "❌ Workflow run monitoring: **FAILED**" >> $GITHUB_STEP_SUMMARY
          else
            echo "⚪ Workflow run monitoring: **SKIPPED**" >> $GITHUB_STEP_SUMMARY
          fi
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### About This Workflow" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "This workflow monitors the health of your CI/CD pipeline by:" >> $GITHUB_STEP_SUMMARY
          echo "- Tracking check suite completion status" >> $GITHUB_STEP_SUMMARY
          echo "- Alerting on critical failures" >> $GITHUB_STEP_SUMMARY
          echo "- Verifying required GATE workflows" >> $GITHUB_STEP_SUMMARY
          echo "- Collecting CI health metrics" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "This helps catch CI misconfigurations and flaky workflows early." >> $GITHUB_STEP_SUMMARY
