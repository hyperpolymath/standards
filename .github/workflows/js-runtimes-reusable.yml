#
# One package.json, three runtimes (3-practice/LANGUAGE-POLICY.adoc §1.4).
#
# For a caller with a package.json, one job per runtime proves that:
#   * package.json is I-JSON + JCS (owner ruling D306; ijson-jcs);
#   * that runtime's lockfile exists and installs FROZEN, so a lock that has
#     fallen behind package.json goes red;
#   * the `test` script, if any, passes under that runtime's own runner.
# The checks are scripts/js-runtimes.sh at this workflow's own commit; the
# fix for any finding is `scripts/js-runtimes.sh regen`.
#
# Usage (caller):
#   jobs:
#     js-runtimes:
#       uses: hyperpolymath/standards/.github/workflows/js-runtimes-reusable.yml@<sha>
#       # with:
#       #   working-directory: web          # default "."
#       #   runtimes: '["bun","pnpm"]'      # default all three
#
# Runtimes are pinned: Bun and Deno by SHA-pinned setup actions, pnpm by
# Corepack with the tarball's sha512 (a wrong hash is refused).
name: JS runtimes (reusable)

on:
  workflow_call:
    inputs:
      working-directory:
        description: Directory holding package.json
        type: string
        default: "."
      runtimes:
        description: JSON array, a subset of ["bun","pnpm","deno"]
        type: string
        default: '["bun","pnpm","deno"]'

permissions:
  contents: read

jobs:
  check:
    name: ${{ matrix.runtime }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        runtime: ${{ fromJSON(inputs.runtimes) }}
    env:
      # pnpm 10.28.0, pinned by its npm tarball's sha512 (hex of dist.integrity).
      PNPM_PIN: pnpm@10.28.0+sha512.05df71d1421f21399e053fde567cea34d446fa02c76571441bfc1c7956e98e363088982d940465fd34480d4d90a0668bc12362f8aa88000a64e83d0b0e47be48
      IJSON_JCS_REV: 0fdeea716fd558e9807362acf6f8202d56d8d88f  # same pin as ijson-jcs.yml (JSON-POLICY §3)
    steps:
      - name: Checkout caller repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Checkout standards for the checker
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: hyperpolymath/standards
          # This reusable's own commit, so the checker is exactly what the
          # caller pinned (the pattern governance-reusable uses).
          ref: ${{ job.workflow_sha }}
          path: .standards-js
          persist-credentials: false
          sparse-checkout: |
            scripts/js-runtimes.sh
          sparse-checkout-cone-mode: false
      - name: Set up Bun
        if: matrix.runtime == 'bun'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.2"
      - name: Set up Deno
        if: matrix.runtime == 'deno'
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: "2.9.6"
      - name: Set up pnpm (Corepack, hash-pinned)
        if: matrix.runtime == 'pnpm'
        run: corepack enable pnpm && corepack install -g "$PNPM_PIN"
      - name: Install ijson-jcs
        env:
          RUNTIME: ${{ matrix.runtime }}
        run: |
          set -euo pipefail
          "$RUNTIME" --version
          cargo install --git https://github.com/hyperpolymath/ijson-jcs --rev "$IJSON_JCS_REV" --locked ijson-jcs
      - name: One manifest, ${{ matrix.runtime }}
        env:
          RUNTIME: ${{ matrix.runtime }}
          WORKDIR: ${{ inputs.working-directory }}
        run: |
          set -uo pipefail
          cp .standards-js/scripts/js-runtimes.sh "$RUNNER_TEMP/js-runtimes.sh"
          rm -rf .standards-js
          bash "$RUNNER_TEMP/js-runtimes.sh" check "$RUNTIME" "$WORKDIR"
