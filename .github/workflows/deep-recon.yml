#
# deep-recon.yml — dogfood caller for deep-recon-reusable.yml.
#
# Deliberately NOT a pull_request gate: PR-time scanning is Hypatia's
# lane (fork-governance), and building two Rust scanners from source on
# every PR would tax exactly the feedback loop the estate keeps fast.
# Deep recon runs where depth belongs — on every merge to main, weekly
# against whatever main has become, and on demand. Nothing here is a
# required context, and making it one is a separate decision that must
# reckon with the build time.

name: Deep Recon

on:
  push:
    branches: [main]
  schedule:
    # Mondays 08:23 UTC — after required-contexts (06:52) and squabble
    # chains (07:17), completing the Monday sweep before the working week.
    - cron: '23 8 * * 1'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  recon:
    permissions:
      contents: read
      security-events: write
    uses: ./.github/workflows/deep-recon-reusable.yml
