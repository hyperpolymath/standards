# SPDX-License-Identifier: MPL-2.0
# This workflow is managed by gh actions-lock.
# deno-ci-reusable.yml — Reusable Deno CI bundle (RSR).
#
# Replaces the per-repo `rescript-deno-ci.yml` template that copy-drifted
# across the estate with several systemic bugs:
#
#   * `deno test` ran unconditionally and failed `No test modules found`
#     on repos with no Deno tests.
#   * `deno lint` / `deno fmt --check` ran unconditionally and failed
#     `No target files found` on repos with no JS/TS targets.
#   * No top-level `permissions:` declaration, tripping the workflow
#     security linter in governance-reusable.yml.
#   * Still invoked `npx rescript` even though ReScript is banned in new
#     code as of 2026-04-30 (see standards/.claude/CLAUDE.md).
#   * The vestigial "security" job grep-audited for permission strings
#     without doing anything useful with the result.
#
# Each step now early-exits cleanly when the inputs don't exist, so the
# job is a no-op on repos that don't yet ship Deno code but pass cleanly
# when they start to.
#
# Caller example (single wrapper, mirrors governance.yml's pattern):
#
#   jobs:
#     deno-ci:
#       uses: hyperpolymath/standards/.github/workflows/deno-ci-reusable.yml@70cdad0e95bb2366a9b2ae9789c0e377fef6e3ef

name: Deno CI (reusable)

on:
  workflow_call:
    inputs:
      runs-on:
        description: Runner label for the deno-ci job
        type: string
        required: false
        default: ubuntu-latest
      deno-version:
        description: Deno version selector
        type: string
        required: false
        default: v2.x

# Only `contents: read` is requested. A reusable workflow may narrow the
# caller's permissions but never widen them: requesting a permission the
# caller has not granted aborts the run as `startup_failure` with ZERO
# jobs — no logs, no red step, just an empty run. The previous
# `actions: read` here was used by no job in this file, so every caller
# granting only `contents: read` (the estate default) failed to start.
permissions:
  contents: read

jobs:
  deno-ci:
    timeout-minutes: 20
    name: Deno CI
    runs-on: ${{ inputs.runs-on }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.ref }}

      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: ${{ inputs.deno-version }}

      - name: Detect Deno targets
        id: detect
        run: |
          # `deno.json` (or its legacy `deno.jsonc`) is the canonical
          # signal that this repo opts into Deno tooling. Do not infer a
          # Deno project from generated or vendored .js/.mjs artefacts: a
          # post-Deno repository may retain those outputs without owning
          # them as a root lint/type-check scope.
          has_config=false
          if [ -f deno.json ] || [ -f deno.jsonc ]; then has_config=true; fi
          echo "has_config=$has_config"   >> "$GITHUB_OUTPUT"
          echo "deno-ci: config=$has_config"

      - name: Deno lint
        if: steps.detect.outputs.has_config == 'true'
        run: deno lint

      - name: Deno fmt check
        if: steps.detect.outputs.has_config == 'true'
        run: deno fmt --check

      - name: Deno test (configured package)
        # A config may intentionally own no tests yet. --permit-no-files keeps
        # that honest scope green without discovering tests in nested products.
        # Avoid requesting a coverage report for an explicitly empty scope:
        # Deno prints "Error generating coverage report" even though it exits 0.
        if: steps.detect.outputs.has_config == 'true'
        run: deno test --allow-all --permit-no-files

      - name: Deno type check
        if: steps.detect.outputs.has_config == 'true'
        # Soft-pass: `deno check` exits non-zero on unresolved imports we
        # don't yet require contributors to vendor. We surface output for
        # diagnostics but don't fail the gate.
        run: |
          if deno task 2>/dev/null | grep -q '^ci:check'; then
            deno task ci:check
          else
            deno check . || echo "::warning::deno check reported issues (non-blocking)."
          fi

      - name: Summary
        run: |
          if [ "${{ steps.detect.outputs.has_config }}" = "false" ]; then
            echo "deno-ci: no root Deno configuration detected — skipped all checks."
          else
            echo "deno-ci: passed (lint / fmt / type / test where applicable)."
          fi
