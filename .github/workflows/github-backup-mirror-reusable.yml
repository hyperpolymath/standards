# This workflow is managed by gh actions-lock.
# SPDX-License-Identifier: MPL-2.0
# github-backup-mirror-reusable.yml — Reusable GitHub→GitHub backup mirror.
#
# `mirror-reusable.yml` covers seven NON-GitHub forges (GitLab, Bitbucket,
# Codeberg, SourceHut, Disroot, Gitea, Radicle). None of them mirror GitHub to
# GitHub, which is what a `metadatastician` → `hyperpolymath` backup needs.
# This reusable fills exactly that gap and copies the house idiom job-for-job.
#
# THREE DELIBERATE DEPARTURES FROM THE NAIVE `git clone --mirror` PATTERN
#
# 1. No `--mirror`, on either end. `git push --mirror` makes the destination
#    match the source EXACTLY, which means it DELETES destination refs that the
#    source does not have. Against a destination that is not already a copy of
#    the source, that is data loss, not a backup. We push one branch.
#
# 2. No `|| true`. The familiar snippet needs it because `git clone --mirror`
#    drags `refs/pull/*/head` and `refs/pull/*/merge` along, and GitHub then
#    rejects those with "deny updating a hidden ref" — a non-zero exit even on a
#    completely successful push. Not cloning `refs/pull/*` removes the reason to
#    suppress the exit code, so the real failure signal survives. Advisory
#    behaviour comes from job-level `continue-on-error`, as in mirror-reusable.
#
# 3. The destination is PROVEN SAFE BEFORE the push, never after. See the
#    "Resolve destination and prove it is safe" step.
#
# ⚠ `continue-on-error: true` means a refusal below shows a GREEN tick and sends
#   no notification. Every refusal therefore writes BOTH `::error::` AND a line
#   to $GITHUB_STEP_SUMMARY, or the guard would be findable only by opening the
#   log of a run that looks like it passed.
#
# Caller example (wrapper):
#   # SPDX-License-Identifier: MPL-2.0
#   name: GitHub Backup Mirror
#   on:
#     push:
#       branches: [main]
#     workflow_dispatch:
#   permissions:
#     contents: read
#   jobs:
#     backup:
#       uses: hyperpolymath/standards/.github/workflows/github-backup-mirror-reusable.yml@<sha>
#       secrets: inherit
#
# Required repo configuration:
#   vars.BACKUP_MIRROR_ENABLED = 'true'      (opt in; off by default)
#   vars.BACKUP_MIRROR_ORG                          (destination owner)
#   vars.BACKUP_MIRROR_AUTOCREATE    = 'true'       (optional; see below)
#   secrets.BACKUP_MIRROR_TOKEN                     (classic PAT)
#
# ⚠ BACKUP_MIRROR_TOKEN needs `repo` AND `workflow` scope. Every repo in this
#   estate contains `.github/workflows/`, and GitHub rejects a push carrying
#   workflow files outright when the token lacks `workflow` scope. A token with
#   only `repo` fails at push time with a message that does not obviously say
#   "scope", so this is worth getting right before the first run.

{
  name: "GitHub Backup Mirror (reusable)",
  on: {
    workflow_call: {
      inputs: {
        runs-on: {
          description: "Runner label for the mirror job",
          type: "string",
          required: false,
          default: "ubuntu-latest",
        },
        destination-branch: {
          description: "Branch name to write on the destination",
          type: "string",
          required: false,
          default: "main",
        },
      },
      secrets: {
        BACKUP_MIRROR_TOKEN: {
          required: false,
        },
      },
    },
  },
  permissions: {
    contents: "read",
  },
  jobs: {
    mirror-github: {
      name: "Mirror to GitHub backup",
      timeout-minutes: 20,
      runs-on: "${{ inputs.runs-on }}",
      if: "vars.BACKUP_MIRROR_ENABLED == 'true'",
      # Advisory mirror: a backup failure must not redden an otherwise good build.
      # The safety checks below still fail closed — they refuse to push.
      continue-on-error: true,
      # Map the secret to env so step `if:`s can gate on its presence: the
      # `secrets` context is NOT available in `if:` (using it is an
      # "Unrecognized named-value: 'secrets'" startup failure that kills the whole
      # workflow before any job runs — `instant-sync.yml` in this very repo still
      # carries that bug). `env` IS available in step `if:`, and secrets are valid
      # in job-level `env`.
      env: {
        MIRROR_TOKEN: "${{ secrets.BACKUP_MIRROR_TOKEN }}",
      },
      steps: [
        {
          uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1", # v7.0.1
          with: {
            # persist-credentials: false is LOAD-BEARING, not hygiene.
            # actions/checkout writes the job GITHUB_TOKEN into the local git
            # config as `http.https://github.com/.extraheader`. That header
            # applies to EVERY github.com remote, including the backup
            # destination — where that token has no write access. An
            # extraheader beats credentials in a remote URL, so leaving it in
            # place makes the push below fail with a 403 that reads like a
            # problem with the PAT. Do not re-enable without unsetting it.
            persist-credentials: false,
            # Full history: a shallow clone cannot answer "is the destination an
            # ancestor of what I am about to push?", which is the whole safety
            # argument below.
            fetch-depth: 0,
          },
        },
        {
          name: "Skipped (BACKUP_MIRROR_TOKEN not configured)",
          if: "${{ env.MIRROR_TOKEN == '' }}",
          run: "set -euo pipefail\necho \"::notice::BACKUP_MIRROR_ENABLED=true but secrets.BACKUP_MIRROR_TOKEN is empty. Skipping GitHub backup mirror.\"\n{\n  echo \"### GitHub backup mirror: skipped\"\n  echo \"\"\n  echo \"\\`BACKUP_MIRROR_ENABLED\\` is \\`true\\` but \\`BACKUP_MIRROR_TOKEN\\` is empty.\"\n  echo \"A skip is not a pass: nothing was mirrored.\"\n} >> \"$GITHUB_STEP_SUMMARY\"\n",
        },
        {
          name: "Resolve destination and prove it is safe",
          id: "resolve",
          if: "${{ env.MIRROR_TOKEN != '' }}",
          env: {
            MIRROR_ORG: "${{ vars.BACKUP_MIRROR_ORG || vars.MIRROR_ORG }}",
            REPO_NAME: "${{ github.event.repository.name }}",
            SRC_OWNER: "${{ github.repository_owner }}",
            AUTOCREATE: "${{ vars.BACKUP_MIRROR_AUTOCREATE }}",
            DEST_BRANCH: "${{ inputs.destination-branch }}",
            GH_TOKEN: "${{ secrets.BACKUP_MIRROR_TOKEN }}",
          },
          run: "set -euo pipefail\n\nrefuse() {\n  # A refusal under continue-on-error is invisible unless it is\n  # written in both places. Say it twice, deliberately.\n  echo \"::error::$1\"\n  {\n    echo \"### GitHub backup mirror: REFUSED\"\n    echo \"\"\n    echo \"$1\"\n  } >> \"$GITHUB_STEP_SUMMARY\"\n  exit 1\n}\n\nif [ -z \"$MIRROR_ORG\" ]; then\n  refuse \"No destination owner. Set vars.BACKUP_MIRROR_ORG (or vars.MIRROR_ORG).\"\nfi\n\n# ── Hard denylist ────────────────────────────────────────────────\n# `.github` is the community-health repo, and the two estate copies\n# are UNRELATED repositories that merely share a name:\n# hyperpolymath/.github and metadatastician/.github differ in size,\n# content and creation date, with no common history. Mirroring by\n# name would overwrite one with the other and destroy real content.\n# This is not configurable, because no configuration makes it safe.\ncase \"$REPO_NAME\" in\n  .github)\n    refuse \"Refusing to mirror '.github': the estate copies are unrelated repositories sharing a name. Mirroring by name would destroy the destination.\"\n    ;;\nesac\n\nif [ \"$MIRROR_ORG\" = \"$SRC_OWNER\" ]; then\n  refuse \"Destination owner equals source owner ($SRC_OWNER); that would mirror a repository onto itself.\"\nfi\n\nDEST_SLUG=\"${MIRROR_ORG}/${REPO_NAME}\"\necho \"Destination: $DEST_SLUG (branch $DEST_BRANCH)\"\n\n# ── Does the destination exist? ──────────────────────────────────\n# Discriminate on the HTTP STATUS, not on whether the command\n# failed. GitHub deliberately returns 404 for a private repository\n# you are not allowed to see, so \"absent\" and \"exists but forbidden\"\n# are the SAME failure from `gh repo view`. Reading a 403 as\n# \"absent\" would send us down the create path against a repository\n# that already exists. `gh api -i` prints the status line, which is\n# the only thing that tells them apart.\ngh api -i \"repos/${DEST_SLUG}\" > \"$RUNNER_TEMP/dest.http\" 2>&1 || true\nCODE=\"$(awk 'NR==1 {print $2; exit}' \"$RUNNER_TEMP/dest.http\")\"\n\nif [[ ! \"$CODE\" =~ ^[0-9]{3}$ ]]; then\n  refuse \"Could not parse an HTTP status from the destination probe for $DEST_SLUG. Refusing to guess whether it exists.\"\nfi\n\ncase \"$CODE\" in\n  200) DEST_EXISTS=true ;;\n  404) DEST_EXISTS=false ;;\n  401|403)\n    refuse \"Destination probe for $DEST_SLUG returned HTTP $CODE. The token is missing, expired, or lacks scope on the destination owner. A 403 is NOT an absent repository: not creating, not pushing.\"\n    ;;\n  *)\n    refuse \"Destination probe for $DEST_SLUG returned HTTP $CODE. Unexpected; refusing to act on an unclassified response.\"\n    ;;\nesac\necho \"destination $DEST_SLUG probe: HTTP $CODE\"\n\nif [ \"$DEST_EXISTS\" = false ]; then\n  if [ \"$AUTOCREATE\" != \"true\" ]; then\n    # Creating repositories is a side effect nobody asked for. Across\n    # this estate 46 of 49 source repos have no same-named\n    # destination, so a default-on autocreate would silently spawn 46\n    # repositories on the first run. Opt in deliberately or not at all.\n    refuse \"Destination $DEST_SLUG does not exist and vars.BACKUP_MIRROR_AUTOCREATE is not 'true'. Create it manually, or set BACKUP_MIRROR_AUTOCREATE=true to allow this workflow to create it private.\"\n  fi\n  echo \"::notice::Creating private destination $DEST_SLUG\"\n  gh repo create \"$DEST_SLUG\" --private \\\n    --description \"Backup mirror of ${SRC_OWNER}/${REPO_NAME}. Managed by github-backup-mirror-reusable.yml.\"\n  # A freshly created repo is empty. Empty is SAFE, not divergent:\n  # there is nothing there to lose.\n  echo \"expected_dest_head=\" >> \"$GITHUB_OUTPUT\"\n  echo \"safe_reason=destination created empty\" >> \"$GITHUB_OUTPUT\"\n  echo \"dest_slug=$DEST_SLUG\" >> \"$GITHUB_OUTPUT\"\n  exit 0\nfi\n\n# ── Destination exists: prove we are not about to clobber it ─────\n# Embed the token in the fetch URL. `secrets.BACKUP_MIRROR_TOKEN`\n# arrives through the secrets context, so Actions masks it in logs;\n# a base64 extraheader would NOT be masked, which is why the plain\n# form is the safer one here.\nDEST_URL=\"https://x-access-token:${MIRROR_TOKEN}@github.com/${DEST_SLUG}.git\"\ngit remote add backup \"$DEST_URL\" 2>/dev/null || git remote set-url backup \"$DEST_URL\"\n\n# `git fetch` returns non-zero for BOTH \"no such branch\" and \"the\n# fetch failed\" (transport, auth, server). Reading that one code as\n# absence lets any outage bypass the ancestry proof below and fall\n# straight through to a force push. `ls-remote` separates them:\n# rc != 0 is a real failure, empty output is a genuinely absent branch.\nif ! LS_OUT=\"$(git ls-remote --heads backup \"refs/heads/${DEST_BRANCH}\" 2>&1)\"; then\n  refuse \"Cannot reach $DEST_SLUG to check for '$DEST_BRANCH'. A failed lookup is NOT proof the branch is absent, so this run refuses rather than force-pushing over a destination it could not read.\"\nfi\n\nif [ -z \"$LS_OUT\" ]; then\n  echo \"::notice::Destination $DEST_SLUG has no '$DEST_BRANCH' branch yet; nothing to overwrite.\"\n  echo \"expected_dest_head=\" >> \"$GITHUB_OUTPUT\"\n  echo \"safe_reason=destination has no $DEST_BRANCH branch\" >> \"$GITHUB_OUTPUT\"\n  echo \"dest_slug=$DEST_SLUG\" >> \"$GITHUB_OUTPUT\"\n  exit 0\nfi\n\n# The branch DOES exist, so a fetch failure here is a real failure.\nif ! git fetch --no-tags backup \"refs/heads/${DEST_BRANCH}:refs/remotes/backup/${DEST_BRANCH}\"; then\n  refuse \"Destination branch '$DEST_BRANCH' exists on $DEST_SLUG but could not be fetched. Refusing to push over a destination whose state could not be read.\"\nfi\n\n# An ancestry proof over a TRUNCATED history is vacuous. With a\n# shallow clone `git merge-base --is-ancestor` can answer \"no\"\n# purely because the common ancestor was never fetched, and it can\n# answer \"yes\" only within the fetched window. checkout above asks\n# for fetch-depth: 0, but a caller override or a grafted repo would\n# silently defeat that — so assert it rather than assume it.\nif [ \"$(git rev-parse --is-shallow-repository)\" != \"false\" ]; then\n  refuse \"Repository is shallow; an ancestry proof over a truncated history proves nothing. Set fetch-depth: 0 on the checkout. Not pushing.\"\nfi\n\nDEST_HEAD=\"$(git rev-parse \"refs/remotes/backup/${DEST_BRANCH}\")\"\nSRC_HEAD=\"$(git rev-parse HEAD)\"\necho \"Destination HEAD: $DEST_HEAD\"\necho \"Source HEAD:      $SRC_HEAD\"\n\nif [ \"$DEST_HEAD\" = \"$SRC_HEAD\" ]; then\n  echo \"expected_dest_head=$DEST_HEAD\" >> \"$GITHUB_OUTPUT\"\n  echo \"safe_reason=already up to date\" >> \"$GITHUB_OUTPUT\"\n  echo \"dest_slug=$DEST_SLUG\" >> \"$GITHUB_OUTPUT\"\n  exit 0\nfi\n\n# The ONLY other safe case: everything the destination has is already\n# contained in what we are about to push. Anything else means the\n# destination holds commits that a force-push would destroy.\nif ! git merge-base --is-ancestor \"$DEST_HEAD\" \"$SRC_HEAD\"; then\n  AHEAD=\"$(git rev-list --count \"^${SRC_HEAD}\" \"${DEST_HEAD}\" 2>/dev/null || echo '?')\"\n  refuse \"Destination $DEST_SLUG has DIVERGED: $DEST_HEAD is not an ancestor of $SRC_HEAD ($AHEAD commit(s) exist only on the destination). Refusing to force-push; reconcile the histories by hand. This is the case the naive 'git push --mirror || true' pattern silently destroys.\"\nfi\n\necho \"expected_dest_head=$DEST_HEAD\" >> \"$GITHUB_OUTPUT\"\necho \"safe_reason=destination is a strict ancestor (fast-forward)\" >> \"$GITHUB_OUTPUT\"\necho \"dest_slug=$DEST_SLUG\" >> \"$GITHUB_OUTPUT\"\n",
        },
        {
          name: "Push to backup mirror",
          if: "${{ env.MIRROR_TOKEN != '' && steps.resolve.outputs.dest_slug != '' }}",
          env: {
            DEST_SLUG: "${{ steps.resolve.outputs.dest_slug }}",
            SAFE_REASON: "${{ steps.resolve.outputs.safe_reason }}",
            EXPECTED_DEST_HEAD: "${{ steps.resolve.outputs.expected_dest_head }}",
            DEST_BRANCH: "${{ inputs.destination-branch }}",
          },
          run: "set -euo pipefail\nDEST_URL=\"https://x-access-token:${MIRROR_TOKEN}@github.com/${DEST_SLUG}.git\"\ngit remote add backup \"$DEST_URL\" 2>/dev/null || git remote set-url backup \"$DEST_URL\"\n\n# HEAD:refs/heads/<branch> rather than a bare branch name: the local\n# branch is not guaranteed to be checked out under every trigger, and\n# this form pushes exactly the commit that was verified above.\n# The ancestry proof was taken in an EARLIER step. The destination can\n# advance in the window between that step and this one, and a bare\n# `--force` would destroy whatever arrived in it. The lease binds this\n# push to the exact SHA that was verified: if the destination moved,\n# the push is rejected instead of overwriting an unseen commit.\nif [ -z \"${EXPECTED_DEST_HEAD:-}\" ]; then\n  # Nothing existed to verify, so creating the branch needs no force.\n  # If it appeared in the meantime this push fails, which is correct.\n  git push backup \"HEAD:refs/heads/${DEST_BRANCH}\"\nelse\n  git push \\\n    --force-with-lease=\"refs/heads/${DEST_BRANCH}:${EXPECTED_DEST_HEAD}\" \\\n    backup \"HEAD:refs/heads/${DEST_BRANCH}\"\nfi\n\n{\n  echo \"### GitHub backup mirror: pushed\"\n  echo \"\"\n  echo \"| Field | Value |\"\n  echo \"|---|---|\"\n  echo \"| Destination | \\`${DEST_SLUG}\\` |\"\n  echo \"| Branch | \\`${DEST_BRANCH}\\` |\"\n  echo \"| Commit | \\`${GITHUB_SHA}\\` |\"\n  echo \"| Safety | ${SAFE_REASON} |\"\n} >> \"$GITHUB_STEP_SUMMARY\"\n",
        },
      ],
    },
  },
}
