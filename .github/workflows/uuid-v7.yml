# SPDX-License-Identifier: MPL-2.0
# Local dogfood gate for the estate UUID standard.
name: UUID v7 conformance

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  uuid-v7:
    name: Reject non-v7 UUID literals
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: scripts/check-uuid-v7.sh .
