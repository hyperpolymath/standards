# SPDX-License-Identifier: MPL-2.0
# Local dogfood gate for the estate UUID standard.
name: UUID v8 conformance

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  uuid-v8:
    name: Reject non-v8 UUID literals
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # ADR-008 strict (owner ruling D320, 2026-10-07): v8 only. Rollback is
      # dropping --strict, which restores P2 dual-accept. Renamed from
      # uuid-v7.yml on 2026-10-14 (owner ruling: two-stage v8 rename). This
      # workflow is not in gates.json, so no derived required context moves.
      - run: scripts/check-uuid-v8.sh --strict .
      - run: bash scripts/tests/uuid-v8-test.sh
