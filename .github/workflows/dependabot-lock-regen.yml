# This workflow is managed by gh actions-lock.
# SPDX-License-Identifier: MPL-2.0
#
# Regenerate actions.lock on open Dependabot PRs across the estate, so a
# github-actions bump can no longer land with a stale lock and redden every
# later PR's "Governance / Actions lockfile verify". Logic, guards and the
# reasoning live in scripts/regen-dependabot-locks.sh; this file only mints the
# credentials and runs it.
#
# CREDENTIAL: the estate's dedicated applier App — vars.APP_ID and
# secrets.APP_PRIVATE_KEY, the same slot apply-workflow-pins.yml and
# signed-push read (owner ruling STD-R-3: NOT OikosBot, which is a ruleset
# bypass actor). Needs Contents R/W, Workflows R/W, Pull requests R, and must
# be installed on BOTH owners. Until it exists the run warns and exits 0.
{
  name: "Dependabot lock regeneration",
  on: {
    schedule: [
      {
        cron: "23,53 * * * *",
      },
    ],
    workflow_dispatch: {
      inputs: {
        repo: {
          description: "Only this owner/repo (empty = every installed repo)",
          required: false,
          default: "",
        },
        dry-run: {
          description: "Regenerate and report, but commit nothing",
          type: "boolean",
          default: false,
        },
      },
    },
  },
  concurrency: {
    group: "${{ github.workflow }}",
    cancel-in-progress: false,
  },
  permissions: {
    contents: "read",
  },
  jobs: {
    regen: {
      runs-on: "ubuntu-latest",
      timeout-minutes: 60,
      steps: [
        {
          name: "Harden runner (egress audit)",
          uses: "step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1", # v2.21.1
          with: {
            egress-policy: "audit",
          },
        },
        {
          uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1", # v7.0.1
          with: {
            persist-credentials: false,
          },
        },
        # An installation token is scoped to ONE owner, so mint one per owner.
        {
          name: "Mint an App installation token for hyperpolymath",
          id: "tok-user",
          if: "vars.APP_ID != ''",
          uses: "actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1", # v3.2.0
          continue-on-error: true,
          with: {
            app-id: "${{ vars.APP_ID }}",
            private-key: "${{ secrets.APP_PRIVATE_KEY }}",
            owner: "hyperpolymath",
          },
        },
        {
          name: "Mint an App installation token for metadatastician",
          id: "tok-org",
          if: "vars.APP_ID != ''",
          uses: "actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1", # v3.2.0
          continue-on-error: true,
          with: {
            app-id: "${{ vars.APP_ID }}",
            private-key: "${{ secrets.APP_PRIVATE_KEY }}",
            owner: "metadatastician",
          },
        },
        {
          name: "Install the lock tooling (same pin as the governance gate)",
          env: {
            GH_TOKEN: "${{ github.token }}",
          },
          run: "sudo apt-get install -y -qq gawk >/dev/null\ngh extension install github/gh-actions-lock --pin v0.1.6\n",
        },
        {
          name: "Regenerate Dependabot PR lockfiles",
          env: {
            REGEN_TOKENS: "hyperpolymath=${{ steps.tok-user.outputs.token }} metadatastician=${{ steps.tok-org.outputs.token }}",
            DRY_RUN: "${{ inputs.dry-run && '1' || '0' }}",
            ONLY_REPO: "${{ inputs.repo }}",
          },
          run: "# A token is an empty string when the App is absent or not installed\n# on that owner; the script names each owner it did NOT examine.\nbash scripts/regen-dependabot-locks.sh ${ONLY_REPO:+\"$ONLY_REPO\"} | tee \"$RUNNER_TEMP/regen.txt\"\n{\n  echo '### Dependabot lock regeneration'\n  echo '```'\n  cat \"$RUNNER_TEMP/regen.txt\"\n  echo '```'\n} >> \"$GITHUB_STEP_SUMMARY\"\n",
        },
      ],
    },
  },
}
