# This workflow is managed by gh actions-lock.
# SPDX-License-Identifier: MPL-2.0
# This workflow is managed by gh actions-lock.
# README single-source derivation — Reusable Workflow (ADR-004)
#
# Author READMEs once in AsciiDoc; derive README.md ONLY for repos that
# declare a Markdown consumer in their descriptiles. This workflow reads that
# declaration, regenerates the derived file behind a fail-closed vocabulary
# gate, and (in the default check mode) fails-and-tells if the committed
# README.md is stale — it never self-commits and never converts an undeclared
# repo. Absence of a declaration is a machine-readable "do not convert": the
# anti-runaway guard that the June 2026 estate-wide .adoc->.md sweep lacked.
{
  name: "README Derive Reusable Workflow",
  on: {
    workflow_call: {
      inputs: {
        runs-on: {
          description: "Runner label",
          type: "string",
          required: false,
          default: "ubuntu-latest",
        },
        threshold: {
          description: "Vocabulary-preservation floor (percent). ADR-004 default 98.",
          type: "number",
          required: false,
          default: 98,
        },
        standards-ref: {
          description: "Ref of hyperpolymath/standards to source the vocab-gate script from.",
          type: "string",
          required: false,
          default: "main",
        },
      },
    },
  },
  permissions: {
    actions: "read",
    contents: "read",
  },
  # Read-only check workflow — safe to cancel superseded runs.
  concurrency: {
    group: "${{ github.workflow }}-${{ github.ref }}",
    cancel-in-progress: true,
  },
  jobs: {
    derive-readme: {
      name: "Derive & verify README.md",
      runs-on: "${{ inputs.runs-on }}",
      timeout-minutes: 30,
      steps: [
        {
          name: "Checkout caller repository",
          uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1", # v4
        },
        {
          name: "Read publishing declaration",
          id: "decl",
          run: "# Prefer descriptiles; fall back to the deprecated 6a2 dir during the\n# estate migration. No file / no [publishing.readme] table / derive\n# not true => this repo has opted out and we do nothing.\nECO=\"\"\nfor c in .machine_readable/descriptiles/ECOSYSTEM.a2ml \\\n         .machine_readable/6a2/ECOSYSTEM.a2ml; do\n  if [ -f \"$c\" ]; then ECO=\"$c\"; break; fi\ndone\n\nif [ -z \"$ECO\" ]; then\n  echo \"No ECOSYSTEM.a2ml found — repo not opted in. Nothing to derive.\"\n  echo \"derive=false\" >> \"$GITHUB_OUTPUT\"\n  exit 0\nfi\necho \"Reading declaration from: $ECO\"\n\n# Extract the flat [publishing.readme] table into KEY=VALUE lines.\neval \"$(\n  awk '\n    /^[[:space:]]*\\[/ { inblk = ($0 ~ /^[[:space:]]*\\[publishing\\.readme\\][[:space:]]*$/) ? 1 : 0; next }\n    inblk && /=/ {\n      key = $0; sub(/=.*/, \"\", key); gsub(/[[:space:]]/, \"\", key)\n      val = $0; sub(/^[^=]*=[[:space:]]*/, \"\", val)\n      sub(/[[:space:]]*(#.*)?$/, \"\", val)          # strip trailing comment/space\n      gsub(/^\"|\"$/, \"\", val)                        # strip surrounding quotes\n      if (key ~ /^(canonical|derive|format|path|consumer)$/)\n        printf \"DECL_%s=%s\\n\", toupper(key), val\n    }\n  ' \"$ECO\"\n)\"\n\nif [ \"${DECL_DERIVE:-false}\" != \"true\" ]; then\n  echo \"[publishing.readme] absent or derive != true — repo not opted in.\"\n  echo \"derive=false\" >> \"$GITHUB_OUTPUT\"\n  exit 0\nfi\n\nCANONICAL=\"${DECL_CANONICAL:-README.adoc}\"\nDERIVED_PATH=\"${DECL_PATH:-README.md}\"\nFORMAT=\"${DECL_FORMAT:-gfm}\"\nCONSUMER=\"${DECL_CONSUMER:-unspecified}\"\n\nif [ ! -f \"$CANONICAL\" ]; then\n  echo \"::error::Declared canonical '$CANONICAL' does not exist.\"\n  exit 1\nfi\nif [ \"$FORMAT\" != \"gfm\" ]; then\n  echo \"::error::Unsupported derived format '$FORMAT' (only 'gfm' is implemented).\"\n  exit 1\nfi\n\necho \"Opted in: consumer=$CONSUMER  $CANONICAL -> $DERIVED_PATH ($FORMAT)\"\n{\n  echo \"derive=true\"\n  echo \"canonical=$CANONICAL\"\n  echo \"derived_path=$DERIVED_PATH\"\n  echo \"consumer=$CONSUMER\"\n} >> \"$GITHUB_OUTPUT\"\n",
        },
        {
          name: "Install toolchain",
          if: "steps.decl.outputs.derive == 'true'",
          env: {
            # Pinned so derivation is REPRODUCIBLE: the same versions used to
            # generate the committed README.md must run in CI, or the freshness
            # check would flag cosmetic toolchain-drift diffs as staleness. Bump
            # deliberately (and regenerate every derived README) — never float.
            PANDOC_VERSION: "3.10",
            ASCIIDOCTOR_VERSION: "2.0.26",
            ASCIIDOCTOR_REDUCER_VERSION: "1.1.1",
          },
          run: "set -euo pipefail\ncurl -fsSL -o /tmp/pandoc.deb \\\n  \"https://github.com/jgm/pandoc/releases/download/${PANDOC_VERSION}/pandoc-${PANDOC_VERSION}-1-amd64.deb\"\nsudo dpkg -i /tmp/pandoc.deb\nsudo gem install --no-document \\\n  \"asciidoctor:${ASCIIDOCTOR_VERSION}\" \\\n  \"asciidoctor-reducer:${ASCIIDOCTOR_REDUCER_VERSION}\"\npandoc --version | head -1\nasciidoctor --version | head -1\n",
        },
        {
          name: "Fetch vocab-gate script from standards",
          if: "steps.decl.outputs.derive == 'true'",
          run: "# Version-locked to the same standards ref that owns this workflow.\ngit clone --depth 1 --branch \"${{ inputs.standards-ref }}\" \\\n  https://github.com/hyperpolymath/standards.git \"$RUNNER_TEMP/standards\"\nchmod +x \"$RUNNER_TEMP/standards/.github/scripts/readme-vocab-gate.sh\"\n",
        },
        {
          name: "Anchor-ID convention guard",
          if: "steps.decl.outputs.derive == 'true'",
          env: {
            CANONICAL: "${{ steps.decl.outputs.canonical }}",
          },
          run: "set -euo pipefail\n# A canonical .adoc with intra-document anchor links (link:#foo[] or\n# <<foo>> written as #foo) only renders a working TOC on GitHub and\n# re-derives to matching Markdown anchors when it opts out of\n# Asciidoctor's default '_prefixed_underscored' section IDs. So if the\n# source uses #anchors, it MUST set :idprefix: (empty) and\n# :idseparator: -  — otherwise every TOC link silently dead-links\n# (a failure the vocabulary gate cannot see, since it checks words not\n# link targets). See ADR-004 \"Bootstrapping a canonical .adoc\".\nif grep -qE 'link:#[a-z0-9-]+\\[' \"$CANONICAL\"; then\n  if ! grep -qE '^:idprefix:[[:space:]]*$' \"$CANONICAL\" \\\n     || ! grep -qE '^:idseparator:[[:space:]]+-[[:space:]]*$' \"$CANONICAL\"; then\n    echo \"::error::$CANONICAL has intra-doc anchor links (link:#…) but does not set ':idprefix:' (empty) and ':idseparator: -' in its header. Without them Asciidoctor generates '_underscored' section IDs and every #anchor TOC link dead-links on GitHub and in the derived README.md. Add both attributes to the document header (see ADR-004).\"\n    exit 1\n  fi\n  echo \"✓ anchor-ID convention satisfied (idprefix/idseparator set)\"\nelse\n  echo \"✓ no intra-doc anchors — convention not required\"\nfi\n",
        },
        {
          name: "Derive Markdown from AsciiDoc",
          if: "steps.decl.outputs.derive == 'true'",
          env: {
            CANONICAL: "${{ steps.decl.outputs.canonical }}",
          },
          run: "set -euo pipefail\n# This step COMMITS what it generates, so a diagnostic that does not\n# stop it is a wrong README baked into a consumer repo. Neither tool\n# below reports cleanliness through its exit code by default, and\n# each needs a different remedy:\n#\n#   asciidoctor's --failure-level defaults to FATAL, so even\n#   \"ERROR: dropping cells from incomplete row\" exits 0 — one stray\n#   '|' in a table cell shifts every later cell and the derived\n#   Markdown silently loses them. The flag below makes the exit code\n#   mean what `set -e` already assumes it means.\n#\n#   asciidoctor-reducer has no --failure-level at all (only\n#   --log-level, which changes what is printed, not what is\n#   returned), so its exit code cannot be made to carry its verdict.\n#   Its stderr is captured and treated as the verdict instead.\n#\n# 1) flatten includes so the source is self-contained\nasciidoctor-reducer \"$CANONICAL\" -o \"$RUNNER_TEMP/reduced.adoc\" \\\n  2>\"$RUNNER_TEMP/reducer.err\"\nif [ -s \"$RUNNER_TEMP/reducer.err\" ]; then\n  echo \"::error::asciidoctor-reducer reported a problem flattening $CANONICAL, so the derived README would be generated from a source it could not read cleanly. Its exit code is 0 either way, which is why this is checked on stderr.\"\n  cat \"$RUNNER_TEMP/reducer.err\" >&2\n  exit 1\nfi\n# 2) reliable route: asciidoc -> docbook -> gfm (direct converters lose structure)\nasciidoctor --failure-level=WARN -b docbook5 -a attribute-missing=drop \\\n  \"$RUNNER_TEMP/reduced.adoc\" -o \"$RUNNER_TEMP/reduced.xml\"\npandoc -f docbook -t gfm --wrap=preserve \\\n  \"$RUNNER_TEMP/reduced.xml\" -o \"$RUNNER_TEMP/body.md\"\n\n# 3) stamp: carry the canonical SPDX line (rewritten as an HTML\n#    comment) + a GENERATED banner so no one hand-edits the artefact.\nSPDX=\"$(grep -m1 -oE 'SPDX-License-Identifier:[[:space:]]*[^[:space:]]+' \"$CANONICAL\" || true)\"\n{\n  [ -n \"$SPDX\" ] && echo \"<!-- $SPDX -->\"\n  echo \"<!-- GENERATED from $CANONICAL by standards/.github/workflows/readme-derive-reusable.yml — do not edit. -->\"\n  echo \"\"\n  cat \"$RUNNER_TEMP/body.md\"\n} > \"$RUNNER_TEMP/derived.md\"\n",
        },
        {
          name: "Vocabulary-preservation gate",
          if: "steps.decl.outputs.derive == 'true'",
          env: {
            CANONICAL: "${{ steps.decl.outputs.canonical }}",
          },
          run: "\"$RUNNER_TEMP/standards/.github/scripts/readme-vocab-gate.sh\" \\\n  \"$CANONICAL\" \"$RUNNER_TEMP/derived.md\" \"${{ inputs.threshold }}\"\n",
        },
        {
          name: "Freshness check (fail-and-tell)",
          if: "steps.decl.outputs.derive == 'true'",
          env: {
            DERIVED_PATH: "${{ steps.decl.outputs.derived_path }}",
            CANONICAL: "${{ steps.decl.outputs.canonical }}",
          },
          run: "set -euo pipefail\n# Normalise before comparing: drop the banner comment lines, trim\n# trailing whitespace, and squeeze blank-line runs. The toolchain is\n# version-pinned so output is reproducible; this normalisation is a\n# belt-and-braces layer that keeps a harmless whitespace nudge from\n# being reported as staleness, while any real prose/structure/anchor\n# change still shows.\nnorm() { grep -vE '^<!-- (SPDX-License-Identifier|GENERATED)' \"$1\" \\\n         | sed 's/[[:space:]]*$//' | cat -s; }\nif [ ! -f \"$DERIVED_PATH\" ]; then\n  echo \"::error::Declared derived README '$DERIVED_PATH' is missing. Regenerate and commit it.\"\n  SHOW_CMD=1\nelif ! diff -q <(norm \"$RUNNER_TEMP/derived.md\") <(norm \"$DERIVED_PATH\") >/dev/null; then\n  echo \"::error::'$DERIVED_PATH' is STALE relative to '$CANONICAL'. Regenerate and commit it.\"\n  echo \"----- diff (committed vs regenerated, normalised) -----\"\n  diff <(norm \"$DERIVED_PATH\") <(norm \"$RUNNER_TEMP/derived.md\") || [ $? -eq 1 ]\n  SHOW_CMD=1\nelse\n  echo \"✓ $DERIVED_PATH is up to date with $CANONICAL\"\n  exit 0\nfi\n\ncat <<'EOF'\n\nTo regenerate locally (requires asciidoctor, asciidoctor-reducer, pandoc):\n\n  asciidoctor-reducer README.adoc -o /tmp/reduced.adoc     # must print nothing\n  asciidoctor --failure-level=WARN -b docbook5 -a attribute-missing=drop /tmp/reduced.adoc -o /tmp/reduced.xml\n  pandoc -f docbook -t gfm --wrap=preserve /tmp/reduced.xml -o /tmp/body.md\n  # then prepend the SPDX + GENERATED banner (see the workflow's stamp step)\n\nFail-and-tell mode (ADR-004): CI does not auto-commit. Commit the\nregenerated README.md yourself.\nEOF\nexit 1\n",
        },
      ],
    },
  },
}
