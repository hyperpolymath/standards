# This workflow is managed by gh actions-lock.
name: README Derive

on:
  push:
    branches: [main, master]
    paths:
      - 'README.adoc'
      - '.publishing.readme'
  pull_request:
    branches: [main, master]
    paths:
      - 'README.adoc'
      - '.publishing.readme'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  # Required: the reusable this calls requests `actions: read`. A caller that
  # declares `permissions:` at all gets `none` for every key it omits, so
  # leaving this out makes GitHub reject the run at startup_failure with zero
  # jobs and no log — "requesting 'actions: read', but is only allowed 'actions: none'".
  actions: read
  contents: write

jobs:
  derive:
    uses: ./.github/workflows/readme-derive-reusable.yml
