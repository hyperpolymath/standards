# This workflow is managed by gh actions-lock.
{
  name: "SPARK Theatre Gate",
  # Estate anti-theatre lint (hyperpolymath/standards#135, sub-issue of #124).
  #
  # Kills "SPARK proof theatre": an Ada unit that declares SPARK_Mode (On)
  # and banners itself "formally verified" / "(Gold)" / "SPARK Proof Level"
  # while no GNATprove run has ever discharged an obligation for it.
  #
  # Per SPARK_Mode-On compilation unit, with no repo-wide prover evidence:
  #
  #   T1  HEADER PROOF-CLAIM WITHOUT PROVER  (hard fail, always)
  #       A strong proof assertion ("formally verified", "SPARK Proof
  #       Level", "(Gold)", "all preconditions and postconditions are
  #       verified", "proving the invariant holds") appears in the file
  #       HEADER BANNER (the comment block before the first code token) of a
  #       SPARK_Mode-On unit. Header-scoped on purpose: an incidental phrase
  #       in a comment deep in the body (e.g. an enum-literal description) is
  #       NOT a claim about the unit and must not trip the gate.
  #
  #   T2  ZERO-CONTRACT SPARK_Mode  (issue #135 verbatim; warn by default)
  #       SPARK_Mode (On) with no Pre/Post/Global/Depends/Contract_Cases.
  #       Hollow SPARK_Mode that proves nothing. Emitted as a warning so
  #       repos mid Ada/SPARK->Rust/SPARK migration are not broken on
  #       rollout; escalates to a hard failure when the caller passes
  #       enforce_zero_contract: true (target end-state per #135).
  #
  # Genuine SPARK repos (echidna, stapeln, ...) pass: GNATprove runs in CI,
  # so "prover evidence" is present and neither T1 nor T2 fires. The gate
  # only bites a regression that re-introduces a hollow "verified" claim.
  #
  # Reusable: a consumer repo adds a 3-line caller (see ambientops
  # .github/workflows/spark-proof-gate.yml). It also self-runs on standards.
  on: {
    workflow_call: {
      inputs: {
        paths: {
          description: "Space-separated roots to scan (default: repo root).",
          required: false,
          type: "string",
          default: ".",
        },
        enforce_zero_contract: {
          description: "Escalate T2 (zero-contract SPARK_Mode) from warning to hard failure.",
          required: false,
          type: "boolean",
          default: false,
        },
      },
    },
    push: {
      branches: [
        "main",
        "master",
      ],
    },
    pull_request: {
      branches: [
        "main",
        "master",
      ],
    },
  },
  concurrency: {
    group: "${{ github.workflow }}-${{ github.ref }}",
    cancel-in-progress: true,
  },
  permissions: {
    actions: "read",
    contents: "read",
  },
  jobs: {
    spark-theatre-gate: {
      timeout-minutes: 20,
      name: "SPARK Theatre Gate",
      runs-on: "ubuntu-latest",
      steps: [
        {
          name: "Checkout",
          uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1", # v7.0.1
        },
        {
          name: "Scan for SPARK proof theatre",
          env: {
            SCAN_PATHS: "${{ inputs.paths || '.' }}",
            ENFORCE_T2: "${{ inputs.enforce_zero_contract && 'on' || 'off' }}",
          },
          run: "set -uo pipefail\n\n# --- Repo-wide: is GNATprove ever actually run? -------------------\nprover_evidence=0\nif grep -rIlE 'gnatprove' .github/workflows 2>/dev/null | grep -q .; then\n  prover_evidence=1\nfi\nfor bf in Justfile justfile Mustfile Dustfile; do\n  [ -f \"$bf\" ] && grep -qI 'gnatprove' \"$bf\" && prover_evidence=1\ndone\nif find . \\( -name 'gnatprove.out' -o -name '*.spark' \\\n            -o -path '*/gnatprove/*.json' \\) \\\n      -not -path '*/.git/*' 2>/dev/null | grep -q .; then\n  prover_evidence=1\nfi\necho \"prover_evidence=$prover_evidence  enforce_t2=$ENFORCE_T2\"\n\nclaim_re='formally verified|SPARK Proof Level|\\(Gold\\)|all preconditions and postconditions are verified|proving the invariant holds'\ncontract_re='Pre[[:space:]]*=>|Post[[:space:]]*=>|Global[[:space:]]*=>|Depends[[:space:]]*=>|Contract_Cases'\nsparkon_re='pragma[[:space:]]+SPARK_Mode[[:space:]]*\\([[:space:]]*On[[:space:]]*\\)|with[[:space:]]+SPARK_Mode[[:space:]]*=>[[:space:]]*On'\n\nfail=0\nwhile IFS= read -r f; do\n  [ -z \"$f\" ] && continue\n\n  # Active SPARK_Mode-On aspect, ignoring commented-out lines.\n  grep -vE '^[[:space:]]*--' \"$f\" | grep -qE \"$sparkon_re\" || continue\n\n  # Header banner = the leading run of comment / blank lines up to\n  # (but excluding) the first non-comment, non-blank code token.\n  header=\"$(awk '\n    /^[[:space:]]*--/ || /^[[:space:]]*$/ { print; next }\n    { exit }' \"$f\")\"\n\n  has_header_claim=0\n  printf '%s\\n' \"$header\" | grep -qiE \"$claim_re\" && has_header_claim=1\n  has_contract=0\n  grep -qE \"$contract_re\" \"$f\" && has_contract=1\n\n  [ \"$prover_evidence\" -eq 1 ] && continue   # prover runs: not theatre\n\n  if [ \"$has_header_claim\" -eq 1 ]; then\n    echo \"::error file=$f::T1 SPARK theatre: header banner claims formal proof but no GNATprove run exists in this repo. Wire gnatprove into CI, or remove the claim and set SPARK_Mode Off (see proven#24 / ambientops safety_boundary for the honest-demotion pattern).\"\n    fail=1\n  elif [ \"$has_contract\" -eq 0 ]; then\n    if [ \"$ENFORCE_T2\" = \"on\" ]; then\n      echo \"::error file=$f::T2 zero-contract SPARK_Mode (standards#135): SPARK_Mode (On) with no Pre/Post/Global/Depends/Contract_Cases and no prover. Add real contracts + a gnatprove gate, or set SPARK_Mode Off.\"\n      fail=1\n    else\n      echo \"::warning file=$f::T2 zero-contract SPARK_Mode (standards#135): SPARK_Mode (On) proves nothing here (no contracts, no prover). Demote to SPARK_Mode Off or add contracts. Escalates to a hard failure once enforce_zero_contract is set.\"\n    fi\n  fi\ndone < <(\n  for root in $SCAN_PATHS; do\n    find \"$root\" \\( -name '*.ads' -o -name '*.adb' \\) \\\n      -not -path '*/.git/*' -not -path '*/obj/*' \\\n      -not -path '*/node_modules/*' 2>/dev/null\n  done\n)\n\nif [ \"$fail\" -ne 0 ]; then\n  echo \"::error::SPARK Theatre Gate FAILED — see annotations. Doctrine: a SPARK_Mode-On unit must either be genuinely proved (GNATprove in CI) or honestly demoted (SPARK_Mode Off + tracked obligation). No hollow 'verified' claims.\"\n  exit 1\nfi\necho \"✓ SPARK Theatre Gate passed (no hollow header proof claims found).\"\n",
        },
      ],
    },
  },
}
