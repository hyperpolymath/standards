# This workflow is managed by gh actions-lock.
{
  name: "GitHub Pages",
  on: {
    push: {
      branches: [
        "main",
      ],
    },
    workflow_dispatch: null,
  },
  # Least privilege: build reads, deploy publishes. Job-level permissions
  # REPLACE (not union) the top level, so each job block below is self-sufficient.
  permissions: {
    contents: "read",
  },
  concurrency: {
    group: "pages",
    cancel-in-progress: false,
  },
  jobs: {
    build: {
      timeout-minutes: 20,
      runs-on: "ubuntu-latest",
      permissions: {
        # Job level replaces the top level — restate the checkout read grant.
        contents: "read",
        actions: "read",
      },
      steps: [
        {
          name: "Checkout",
          uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1", # v7.0.1
        },
        {
          name: "Checkout casket-ssg",
          uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1", # v7.0.1
          with: {
            repository: "hyperpolymath/casket-ssg",
            path: ".casket-ssg",
          },
        },
        {
          name: "Setup GHCup",
          uses: "haskell-actions/setup@0f8e8c99d88aeb3fbfd523f1ef2c6f762d10d64d", # v2.12.1
          with: {
            ghc-version: "9.8.2",
            cabal-version: "3.10",
          },
        },
        {
          name: "Cache Cabal",
          uses: "actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9", # v6.1.0
          with: {
            path: "~/.cabal/packages\n~/.cabal/store\n.casket-ssg/dist-newstyle\n",
            key: "${{ runner.os }}-casket-${{ hashFiles('.casket-ssg/casket-ssg.cabal') }}",
          },
        },
        {
          name: "Build casket-ssg",
          working-directory: ".casket-ssg",
          run: "cabal build",
        },
        {
          name: "Build site",
          run: "mkdir -p site _site\n# Generate index.md from README if site/index.md doesn't exist\nif [ ! -f site/index.md ]; then\n  if [ -f README.adoc ]; then\n    # Convert AsciiDoc to Markdown (basic conversion)\n    echo \"---\" > site/index.md\n    echo \"title: $(basename $PWD)\" >> site/index.md\n    echo \"date: $(date +%Y-%m-%d)\" >> site/index.md\n    echo \"---\" >> site/index.md\n    cat README.adoc >> site/index.md\n  elif [ -f README.md ]; then\n    echo \"---\" > site/index.md\n    echo \"title: $(basename $PWD)\" >> site/index.md\n    echo \"date: $(date +%Y-%m-%d)\" >> site/index.md\n    echo \"---\" >> site/index.md\n    cat README.md >> site/index.md\n  else\n    echo \"---\" > site/index.md\n    echo \"title: $(basename $PWD)\" >> site/index.md\n    echo \"date: $(date +%Y-%m-%d)\" >> site/index.md\n    echo \"---\" >> site/index.md\n    echo \"\" >> site/index.md\n    echo \"# $(basename $PWD)\" >> site/index.md\n    echo \"\" >> site/index.md\n    echo \"Documentation coming soon.\" >> site/index.md\n  fi\nfi\ncd .casket-ssg && cabal run casket-ssg -- build ../site ../_site\n",
        },
        {
          name: "Setup Pages",
          uses: "actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d", # v6.0.0
        },
        {
          name: "Upload artifact",
          uses: "actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9", # v5.0.0
          with: {
            path: "_site",
          },
        },
      ],
    },
    deploy: {
      timeout-minutes: 20,
      environment: {
        name: "github-pages",
        url: "${{ steps.deployment.outputs.page_url }}",
      },
      runs-on: "ubuntu-latest",
      needs: "build",
      permissions: {
        pages: "write",
        id-token: "write",
      },
      steps: [
        {
          name: "Deploy to GitHub Pages",
          id: "deployment",
          uses: "actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346", # v5.0.1
        },
      ],
    },
  },
}
