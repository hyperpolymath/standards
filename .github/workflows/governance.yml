# This workflow is managed by gh actions-lock.
name: Governance

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  governance:
    uses: ./.github/workflows/governance-reusable.yml
    with:
      # This repository dates every acknowledgement (2026-10-24: 63/63), so an
      # undated one is a regression, not legacy debt. Without this a future
      # entry added without a date would be warned about and ignored — which is
      # how the 23 got there in the first place.
      baseline-strict: true
    # Only the one secret the callee declares (optional). Was `secrets:
    # inherit`, which forwarded every repo/org secret (standards#1108
    # §6b); narrowed to the callee's declared contract.
    secrets:
      HYPATIA_SCAN_PAT: ${{ secrets.HYPATIA_SCAN_PAT }}
