# This workflow is managed by gh actions-lock.
# SPDX-License-Identifier: MPL-2.0
name: deed-conformance

# Conformance lane for the DEED grammar (standards#837).
#
# In this repo (push / pull_request) three gates run: validator self-test,
# fixture corpus, every committed *.deed file.
#
# As a reusable (workflow_call) it lints the CALLER's committed *.deed files
# with the linter at THIS workflow's own commit (job.workflow_sha), so a
# caller pinned to a standards SHA gets exactly that linter.
#
# Caller:
#   jobs:
#     deed:
#       uses: hyperpolymath/standards/.github/workflows/deed-conformance.yml@<sha>
#       with:
#         require-files: true   # fail when the caller has no .deed at all

on:
  push:
    paths:
      - '**.deed'
      - '1-formats/deed/**'
      - '.github/workflows/deed-conformance.yml'
  pull_request:
    paths:
      - '**.deed'
      - '1-formats/deed/**'
      - '.github/workflows/deed-conformance.yml'
  workflow_call:
    inputs:
      require-files:
        description: "Fail when the caller has no committed .deed file (a zero-file run is otherwise a pass)."
        type: boolean
        required: false
        default: false

permissions: {}

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      # In this repo the PR's own linter is in the first checkout; a caller
      # gets the linter from the canon checkout at job.workflow_sha.
      T: ${{ github.repository == 'hyperpolymath/standards' && '1-formats/deed/tools' || '.deed-canon/1-formats/deed/tools' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: checkout the deed linter at this workflow's commit
        if: github.repository != 'hyperpolymath/standards'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: hyperpolymath/standards
          ref: ${{ job.workflow_sha }}
          path: .deed-canon
          persist-credentials: false
          sparse-checkout: "1-formats/deed/tools\n"
          sparse-checkout-cone-mode: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - name: validator self-test
        if: github.repository == 'hyperpolymath/standards'
        run: bun "$T/deed_lint.js" --self-test
      - name: validator unit tests
        if: github.repository == 'hyperpolymath/standards'
        run: bun test "$T/"
      - name: fixture corpus (valid must pass, invalid must fail)
        if: github.repository == 'hyperpolymath/standards'
        run: bun "$T/deed_lint.js" --fixtures "$T/fixtures"
      - name: python/bun parity (byte-identical output over every committed deed)
        if: github.repository == 'hyperpolymath/standards'
        run: |
          set -euo pipefail
          find . -name '*.deed' -not -path './.deed-canon/*' -print | sort > "$RUNNER_TEMP/all"
          test -s "$RUNNER_TEMP/all"
          xargs python3 "$T/deed_lint.py" < "$RUNNER_TEMP/all" > "$RUNNER_TEMP/py" || true
          xargs bun "$T/deed_lint.js" < "$RUNNER_TEMP/all" > "$RUNNER_TEMP/js" || true
          wc -l "$RUNNER_TEMP/py" "$RUNNER_TEMP/js"
          diff -u "$RUNNER_TEMP/py" "$RUNNER_TEMP/js"
      - name: lint every committed deed
        env:
          REQUIRE_FILES: ${{ inputs.require-files || false }}
        run: |
          set -euo pipefail
          find . -name '*.deed' -not -path './.deed-canon/*' -not -path './1-formats/deed/tools/fixtures/invalid/*' -print | sort > "$RUNNER_TEMP/deeds"
          if [ ! -s "$RUNNER_TEMP/deeds" ]; then
            if [ "$REQUIRE_FILES" = "true" ]; then
              echo "::error::require-files is set and no committed .deed file was found"
              exit 1
            fi
            echo "no committed .deed files — nothing to lint"
            exit 0
          fi
          echo "linting $(wc -l < "$RUNNER_TEMP/deeds") file(s)"
          xargs bun "$T/deed_lint.js" < "$RUNNER_TEMP/deeds"
