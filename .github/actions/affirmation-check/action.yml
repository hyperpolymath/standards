# SPDX-License-Identifier: MPL-2.0
name: 'Affirmation Document Gate'
description: 'Validates an applicable AFFIRMATION snapshot without treating it as a universal or self-proving document.'
inputs:
  required:
    description: 'Set true only when the repository declares the governance-tier capability.'
    required: false
    default: 'false'
  is-template:
    description: >-
      Set true for a template repository, whose AFFIRMATION.adoc is expected to
      carry {{…}} placeholders. Defaults to the repository''s own is_template
      flag, so template repos are exempt without per-repo configuration.
    required: false
    default: ${{ github.event.repository.is_template }}
runs:
  using: 'composite'
  steps:
    - name: Run Affirmation Check
      shell: bash
      env:
        AFFIRMATION_REQUIRED: ${{ inputs.required }}
        AFFIRMATION_IS_TEMPLATE: ${{ inputs.is-template }}
      run: "${{ github.action_path }}/check.sh"
